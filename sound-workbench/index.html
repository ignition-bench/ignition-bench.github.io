<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Workbench · 사운드 작업대</title>
<style>
:root{
  --bg:#121419; --panel:#1a1d24; --panel2:#20242d; --line:#2b303b; --line2:#3a404d;
  --text:#e7e9ef; --muted:#8a90a0; --accent:#4fd1a9; --accent-d:#1f5e4c;
  --bake:#ff8a5c; --run:#6aa8ff; --loop:#f2b84b; --trim:#e5677d; --danger:#ff6b6b; --help:#9b7bff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--line2);background:#272c36}
button.primary{background:var(--accent-d);border-color:var(--accent)}
button.on{background:var(--accent-d);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--text);background:#0e1014;border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input[type=number]{width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.muted{color:var(--muted)}
small{color:var(--muted)}

.top{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.3px}
.brand .ver{font-size:11px;color:var(--muted);font-weight:400}
.ib-home{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#0d2541;border:1px solid #a8c5ea66;text-decoration:none;box-sizing:border-box}.ib-home:hover,.ib-home:focus-visible{border-color:#ff7a2f;box-shadow:0 0 0 2px #ff7a2f44}.ib-home[hidden]{display:none}
.grp{display:flex;align-items:center;gap:6px}
.grp.right{margin-left:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--loop);margin-left:6px;vertical-align:middle}
.btn-help{background:rgba(155,123,255,.16);border-color:#7d62d8;color:#e9e1ff}
.btn-help:hover{background:rgba(155,123,255,.3);border-color:var(--help)}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(155,123,255,0)}50%{box-shadow:0 0 0 4px rgba(155,123,255,.28),0 0 14px rgba(155,123,255,.45)}}
.langseg{display:inline-flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.langseg button{border:0;border-radius:0;padding:3px 10px;font-size:12px;background:transparent;color:var(--muted)}
.langseg button.on{background:var(--panel2);color:var(--text)}
.expwrap{position:relative;display:inline-flex}
.expwrap #btnExportAll{border-top-right-radius:0;border-bottom-right-radius:0}
.expwrap #btnExpOpt{border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid rgba(0,0,0,.35);padding:5px 8px}
#expPop{position:absolute;right:0;top:calc(100% + 6px);width:360px;background:#1f2430;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5);line-height:1.5}
#expPop[hidden]{display:none}
#expPop h4{margin:0 0 8px;font-size:13px}
#expPop .sec{font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
#expPop label.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin:4px 0;cursor:pointer}
#expPop label.opt.sel{border-color:var(--accent);background:rgba(79,209,169,.07)}
#expPop label.opt input{margin-top:3px}
#expPop .d{font-size:11.5px;color:var(--muted)}
#expPop .fixed{padding:6px 8px;border:1px dashed var(--line2);border-radius:7px;font-size:12px}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
#list{flex:1;overflow:auto}
.item{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 6px}
.item:hover{background:#1f232b}
.item.sel{background:#22312d;border-left:3px solid var(--accent);padding-left:9px}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--muted);font-size:11px}
.item .del{grid-row:1/3;grid-column:2;align-self:center;padding:2px 7px;font-size:11px;opacity:.55}
.item .del:hover{opacity:1;border-color:var(--danger)}
.chip{display:inline-block;font-size:10px;padding:0 6px;border-radius:9px;border:1px solid var(--line2);margin-right:4px}
.chip.missing{border-color:var(--danger);color:var(--danger)}
.drop{margin:10px;padding:18px 10px;border:2px dashed var(--line2);border-radius:8px;text-align:center;color:var(--muted);line-height:1.6}
.drop.hover,.empty.hover{border-color:var(--accent);color:var(--accent)}

.main{overflow:auto;min-width:0}
.empty{margin:40px auto;max-width:540px;text-align:center;border:2px dashed var(--line2);border-radius:12px;padding:40px 24px;color:var(--muted);line-height:1.8}
.empty h2{color:var(--text);margin:0 0 10px;font-size:18px}
.steps{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px}
.empty .ebtns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}

#editor[hidden]{display:none}
.titlebar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.titlebar label{color:var(--muted);font-size:12px;white-space:nowrap}
#soundId{width:180px;font-weight:600}
.card > .titlebar{flex-wrap:nowrap;min-width:0}
.card > .titlebar #srcInfo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wscroll{flex:1}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);padding:0 12px 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}

.chain{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;overflow-y:hidden;padding:0 4px;scrollbar-width:thin}
.blk{min-width:66px;padding:7px 10px 6px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;position:relative;top:1px;flex:none;text-align:left}
.blk:hover{border-color:var(--line2)}
.blk .bn{font-weight:600;font-size:12px}
.blk .bs{font-size:10.5px;color:var(--muted);white-space:nowrap}
.blk.bake{border-top:3px solid rgba(255,138,92,.35)}
.blk.run{border-top:3px solid rgba(106,168,255,.35)}
.blk.active.bake{border-top-color:var(--bake)}
.blk.active.run{border-top-color:var(--run)}
.blk.active .bs{color:var(--text)}
.blk.unused{opacity:.45}
.blk.cur{outline:2px solid var(--accent);outline-offset:1px}
.arrow{align-self:center;color:var(--muted);padding:0 4px}
.divider{align-self:stretch;width:2px;background:repeating-linear-gradient(var(--line2) 0 4px,transparent 4px 8px);margin:0 8px}

.bottom{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:0;background:var(--panel);border:1px solid var(--bake);border-radius:10px;overflow:hidden;position:relative;z-index:1}
.bottom.k-run{border-color:var(--run)}
.panel,.monitor{background:var(--panel);min-width:0}
.monitor{border-left:1px solid var(--line)}
.panel{overflow:auto;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;flex-wrap:wrap}
.ptitle{font-weight:700}
.badge{font-size:11px;padding:1px 8px;border-radius:9px}
.badge.bake{color:var(--bake);border:1px solid rgba(255,138,92,.45)}
.badge.run{color:var(--run);border:1px solid rgba(106,168,255,.45)}
.phead .sp{margin-left:auto}
.pbody{padding:10px 12px}
.hint{font-size:11.5px;color:var(--muted);background:#15181e;border-left:3px solid var(--line2);padding:6px 9px;margin:6px 0 10px;border-radius:0 5px 5px 0;line-height:1.55}
.hint.warn{border-left-color:var(--loop);color:#d8c79c}
.row{display:grid;grid-template-columns:118px 1fr 78px 82px;gap:8px;align-items:center;margin:5px 0}
.row .lab{cursor:default;user-select:none}
.row .lab:hover{color:var(--accent)}
.row .unit{font-size:11px;color:var(--muted);white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.col{background:#15181e;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.col h4{margin:0 0 4px;font-size:12px;color:var(--accent);font-weight:600}
.col .row{grid-template-columns:1fr auto;gap:2px 6px;margin:4px 0}
.col .row .lab{grid-column:1/-1;font-size:11px;color:var(--muted)}
.col .row input[type=range]{grid-column:1/-1}
.col .row .num{width:70px}
.curve{width:100%;height:clamp(80px,14vh,130px);display:block;border:1px solid var(--line);border-radius:6px;background:#0d0f13;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.inline{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .tr{width:34px;height:18px;border-radius:9px;background:#333845;position:relative;transition:.15s;flex:none}
.switch .tr:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#cfd3dc;top:2px;left:2px;transition:.15s}
.switch input:checked + .tr{background:var(--accent-d)}
.switch input:checked + .tr:after{left:18px;background:var(--accent)}
.disabledBody{opacity:.45}

.monitor{padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.monitor h5{margin:0;font-size:12px;color:var(--muted);font-weight:600}
#spec{width:100%;height:clamp(60px,12vh,120px);display:block;border-radius:5px;background:#0d0f13}
#meter{width:100%;height:46px;display:block;border-radius:5px;background:#0d0f13}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2a303b;border:1px solid var(--line2);padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:80%}
#toast.show{opacity:1}
@media (max-width:980px){.bottom{grid-template-columns:1fr}.monitor{border-left:0;border-top:1px solid var(--line)}.cols{grid-template-columns:repeat(2,1fr)}}
@media (max-height:860px){
  .top{padding:5px 12px;gap:10px}
  .side-head{padding:7px 12px}
  .item{padding:6px 12px}
  .drop{margin:6px;padding:8px 8px;line-height:1.35}
  .titlebar{padding:5px 14px}
  .legend{display:none}
  .ftab{padding:5px 9px 4px}
  .phead{padding:6px 12px}
  .pbody{padding:6px 12px}
  .hint{margin:4px 0 6px;padding:5px 8px}
  .row{margin:3px 0}
  .monitor{padding:8px 10px;gap:5px}
}
@media (max-height:700px){ .drop small{display:none} .ftab .bs{display:none} }

.modal{position:fixed;inset:0;background:rgba(5,7,10,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px}
.modal[hidden]{display:none}
.mbox{width:min(760px,100%);max-height:90vh;background:var(--panel);border:1px solid var(--line2);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mhead{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead b{font-size:15px;white-space:nowrap}
#helpQ{flex:1;font-size:14px;padding:7px 10px}
.mtags{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.mtags button{font-size:11.5px;padding:2px 9px;border-radius:12px}
.mlist{overflow:auto;padding:6px 14px 14px}
.topic{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#171a20}
.topic summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.topic summary::-webkit-details-marker{display:none}
.topic summary:before{content:"▸";color:var(--muted)}
.topic[open] summary:before{content:"▾"}
.topic .tb{padding:0 14px 12px 28px;line-height:1.7;color:#cfd3dc}
.topic .tb b{color:var(--text)}
.topic .tb ol,.topic .tb ul{margin:4px 0;padding-left:20px}
.topic .tact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.topic mark{background:rgba(242,184,75,.35);color:inherit;border-radius:2px}
.topic.pin{border-color:var(--help)}
.noresult{color:var(--muted);padding:20px;text-align:center}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;font-family:Consolas,monospace}

#tourSpot{position:fixed;z-index:50;border-radius:8px;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(5,7,10,.62);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s;animation:pulse 1.6s infinite}
#tourSpot.center{border:0;animation:none}
@keyframes pulse{0%,100%{outline:0 solid rgba(79,209,169,.5)}50%{outline:6px solid rgba(79,209,169,.18)}}
#tourBubble{position:fixed;z-index:51;width:330px;background:#1f2430;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.55);line-height:1.6}
#tourBubble .tstep{font-size:11px;color:var(--accent);margin-bottom:2px}
#tourBubble .ttitle{font-weight:700;font-size:14px;margin-bottom:4px}
#tourBubble .ttext{color:#d5d9e2}
#tourBubble .twait{margin-top:8px;font-size:12px;color:var(--loop)}
#tourBubble .twait.done{color:var(--accent)}
#tourBubble .tbtns{display:flex;gap:6px;margin-top:10px}
#tourBubble .tbtns #tNext{margin-left:auto}
.langfade{animation:langfade .28s ease}
@keyframes langfade{from{opacity:.35}to{opacity:1}}


.blk .bn{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.blk .bn .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid #6b7180;flex:none}
.blk .bs{font-size:10.5px;color:var(--muted);white-space:nowrap}
.blk.bake{background:rgba(255,138,92,.09);border-color:rgba(255,138,92,.42);border-top:3px solid rgba(255,138,92,.42)}
.blk.bake .bn{color:#ffc3a8}
.blk.bake.active .tdot{background:var(--bake);border-color:var(--bake)}
.blk.run{background:rgba(106,168,255,.09);border-color:rgba(106,168,255,.42);border-top:3px solid rgba(106,168,255,.42)}
.blk.run .bn{color:#bcd6ff}
.blk.run.active .tdot{background:var(--run);border-color:var(--run)}
.blk:not(.active) .bn{opacity:.62}
.blk:hover{filter:brightness(1.18)}
.blk.cur{background:var(--panel);z-index:2;padding-bottom:8px;outline:0}
.blk.cur .bn{opacity:1}
.blk.cur.bake{border-color:var(--bake);border-top-color:var(--bake);box-shadow:0 -2px 10px rgba(255,138,92,.18)}
.blk.cur.run{border-color:var(--run);border-top-color:var(--run);box-shadow:0 -2px 10px rgba(106,168,255,.18)}
.blk.unused{opacity:.45}
.ftabs .gap{width:10px;flex:none}
.tlegend{margin-left:auto;display:flex;gap:12px;font-size:11.5px;white-space:nowrap}
.tlegend .lf{color:var(--bake)}.tlegend .lg{color:var(--run)}
.saveone{border-color:rgba(255,138,92,.5);color:#ffd2bf}
.top{gap:6px;padding:7px 12px}
.top .grp{gap:4px}
.top button{padding:5px 8px}
.top .langseg button{padding:3px 8px}
#dirName{font-size:12px}
.vol{gap:5px;padding:2px 9px 2px 3px;border:1px solid var(--line);border-radius:14px;background:#14171d}
.vol .volic{border:0;background:transparent;padding:2px 5px}
.vol input{width:64px}
.vol #monVolV{font-size:11.5px;color:var(--muted);min-width:30px}
.vol.mute #monVolV{color:var(--danger)}
#zSel.on{background:var(--accent-d);border-color:var(--accent);color:#fff}
.sidetabs{gap:4px;padding:8px 8px 0}
.sidetabs button{border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;position:relative;top:1px;padding:8px 4px}
.sidetabs button:hover{color:#c8ccd6;background:#1f232b}
.sidetabs button.on{color:var(--accent);background:rgba(79,209,169,.10);border-color:var(--accent-d);box-shadow:inset 0 3px 0 var(--accent)}
.side-head small{display:block;font-weight:400;margin-top:2px}
.sidetabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.sidetabs button{flex:1;background:transparent;color:var(--muted);font-weight:600}
.sidetabs button:hover{background:#1f232b}

#minePane,#libPane{flex:1;min-height:0;display:flex;flex-direction:column}
#minePane[hidden],#libPane[hidden],#libConnect[hidden],#libBody[hidden]{display:none}
.libconnect{padding:14px 12px;line-height:1.6;color:var(--muted);overflow:auto}
.libconnect h4{color:var(--text);margin:0 0 6px;font-size:14px}
.libconnect .lbtn{display:block;width:100%;text-align:left;margin:10px 0 0;padding:9px 11px;white-space:normal;line-height:1.45}
.libconnect .lbtn small{display:block;margin-top:2px}
.libconnect .lbtn[hidden]{display:none}
.libconnect .lurl{margin-top:14px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.libconnect .lurl b{color:var(--text);font-weight:400}
.libconnect .urlrow{display:flex;gap:6px;margin:6px 0 2px}
.libconnect .urlrow input{flex:1;min-width:0}
#libBody{flex:1;min-height:0;display:flex;flex-direction:column}
.libhead{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;flex:none}
.libhead .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.libhead button{font-size:11px;padding:2px 8px}
.libfil{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;flex:none}
#libQ{width:100%;padding:5px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chips .mlab{font-size:10.5px;color:var(--muted);margin:0 2px 0 4px}
.chips .mlab:first-child{margin-left:0}
.chips .brk{flex-basis:100%;height:0}
.fchip{font-size:11px;padding:1px 8px;border-radius:11px;background:transparent}
.fchip.on{background:var(--accent-d);border-color:var(--accent);color:#fff}
.fchip .n{color:var(--muted);margin-left:4px;font-size:10px}
.fchip.on .n{color:#cfeee4}
.libsel{display:flex;gap:6px}
.libsel select{flex:1;min-width:0}
.libcount{padding:5px 12px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none;border-bottom:1px solid var(--line)}
.libcount button{margin-left:auto;font-size:11px;padding:1px 8px}
.libcount button[hidden]{display:none}
#libList{flex:1;overflow:auto}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:1px 8px;align-items:center;padding:6px 10px 6px 12px;border-bottom:1px solid var(--line);cursor:default}
.lrow:hover{background:#1f232b}
.lrow.var{padding-left:28px;background:#16191f}
.lrow .play{grid-row:1/3;width:30px;padding:4px 0;text-align:center}
.lrow .play.on{border-color:var(--accent);color:var(--accent)}
.lrow .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lrow.var .tt{font-weight:400}
.lrow .sub{grid-column:2;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lrow .acts{grid-row:1/3;grid-column:3;display:flex;gap:4px;align-items:center}
.lrow .acts .add{padding:3px 9px;border-color:var(--accent-d)}
.lrow .acts .add:hover{border-color:var(--accent);color:var(--accent)}
.lrow .acts .more{font-size:11px;padding:2px 7px;color:var(--muted)}
.chip.lib{border-color:#6a8cff;color:#a9bcff}

function drawMonitor(){
  const cv = $('#spec'), mt = $('#meter'); if (!cv || $('#editor').hidden) return;

  const nyq = ctx ? ctx.sampleRate/2 : 24000;
  g.strokeStyle = '#1f2430'; g.fillStyle = '#5d6373'; g.font = '9px sans-serif';
  for (const f of [100, 1000, 10000]){ const x = Math.log(f/20)/Math.log(nyq/20)*W; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); g.fillText(fmtF(f) + 'Hz', x + 2, H - 3); }
  const M = prep(mt), m = M.g;

  if (!pv) return;

  an.getFloatFrequencyData(specBuf);
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, 'rgba(79,209,169,.9)'); grad.addColorStop(1, 'rgba(79,209,169,.08)');

  const dbx = d => clamp((d + 60)/60, 0, 1)*(M.W - 44), y1 = 6, bh = 12;
  m.fillStyle = '#1b1f27'; m.fillRect(0, y1, M.W - 44, bh);

let curveCtx = null;
function drawResponse(cv, defs, handles){
  const {g, W, H} = prep(cv);
  g.fillStyle = '#0d0f13'; g.fillRect(0, 0, W, H);
  const fx = f => Math.log(f/20)/Math.log(1000)*W, gy = d => H/2 - d/24*(H/2 - 8);
  g.strokeStyle = '#1f2430'; g.fillStyle = '#5d6373'; g.font = '9px sans-serif';
  for (const f of [50,100,200,500,1000,2000,5000,10000]){ const x = fx(f); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); g.fillText(fmtF(f), x + 2, H - 3); }
  for (const d of [-24,-12,0,12,24]){ const y = gy(d); g.strokeStyle = d === 0 ? '#2f3542' : '#1f2430'; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.fillText((d > 0 ? '+' : '') + d, 2, y - 2); }

    g.fillStyle = '#111'; g.font = 'bold 9px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(i + 1, x, y + 0.5);

}

function setupEqDrag(cv, s){
  let di = -1;
  const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top, W:r.width, H:r.height}; };
  cv.style.cursor = 'pointer';
  cv.addEventListener('mousedown', e => {
    const p = pos(e); let best = 12;
    s.eq.bands.forEach((b, i) => { const x = Math.log(b.freq/20)/Math.log(1000)*p.W, y = p.H/2 - b.gain/24*(p.H/2 - 8); const d = Math.hypot(x - p.x, y - p.y); if (d < best){ best = d; di = i; } });
    if (di >= 0){ if (!s.eq.enabled){ s.eq.enabled = true; renderPanel(); changed(); } e.preventDefault(); }
  });
  window.addEventListener('mousemove', e => {
    if (di < 0 || !cv.isConnected) return;
    const p = pos(e), b = s.eq.bands[di];
    b.freq = Math.round(clamp(20*Math.pow(1000, clamp(p.x/p.W, 0, 1)), 20, 20000));
    b.gain = Math.round(clamp((p.H/2 - p.y)/(p.H/2 - 8)*24, -24, 24)*10)/10;
    rowSyncs.forEach(f => f()); changed();
  });
  window.addEventListener('mouseup', () => { di = -1; });
}

function autoTrim(){
  if (!cur || !cur.buffer) return;
  const b = cur.buffer, th = Math.pow(10, -50/20), n = b.length, sr = b.sampleRate, chs = [];
  for (let c = 0; c < b.numberOfChannels; c++) chs.push(b.getChannelData(c));
  let first = 0, last = n - 1;
  outer: for (let i = 0; i < n; i++) for (const d of chs) if (Math.abs(d[i]) > th){ first = i; break outer; }
  outer2: for (let i = n - 1; i >= 0; i--) for (const d of chs) if (Math.abs(d[i]) > th){ last = i; break outer2; }
  const s = cur.settings;
  s.trim.start = clamp(first/sr - 0.005, 0, cur.duration);
  s.trim.end = clamp(last/sr + 0.02, s.trim.start + 0.01, cur.duration);
  fixLoop(); regionChanged(true);
  toast(t('autoTrimDone', {a:s.trim.start.toFixed(3), b:(cur.duration - s.trim.end).toFixed(3)}));
}

async function addFiles(files){
  const list = [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(f.name));
  if (!list.length){ toast(t('notAudio')); return; }
  ensureCtx();
  let last = null, attached = 0;
  for (const f of list){
    toast(t('loading', {n:f.name}), 8000);
    let buf;
    try { buf = await ctx.decodeAudioData(await f.arrayBuffer()); }
    catch(e){ console.error(e); toast(t('badFile', {n:f.name})); continue; }
    if (attachExtraFile(f, buf)){ attached++; continue; }
    let sd = sounds.find(x => !x.buffer && x.sourceName === f.name);
    if (sd){
      sd.file = f; attachBase(sd, buf);
      attached++;
    } else {
      const s = defaultSettings(); s.trim.end = buf.duration;
      if (buf.duration >= 15){ s.category = 'bgm'; s.rules.maxInstances = 1; s.loop = {enabled:true, start:0, end:buf.duration}; }
      sd = {id:uniqueId(sanitizeId(f.name)), sourceName:f.name, buffer:buf, duration:buf.duration, peaks:buildPeaks(buf), settings:s, file:f};
      sounds.push(sd); setDirty(true);
    }
    last = sd;
  }
  renderList();
  if (last){ selectSound(last); if (typeof setSideTab === 'function') setSideTab('mine'); }
  toast(attached ? t('loadedLinked', {n:attached}) : t('loaded'));
}

function tailOf(s){
  if (!general() && s.loop.enabled) return 0;
  let tl = 0;
  if (s.reverb.enabled) tl = Math.max(tl, s.reverb.preDelay + s.reverb.decay);
  if (s.delay.enabled && s.delay.mix > 0){ const fb = Math.max(0.01, s.delay.feedback); tl = Math.max(tl, s.delay.time*Math.min(30, Math.log(0.001)/Math.log(fb) + 1)); }
  return Math.min(10, tl);
}

function mergeDeep(base, src){
  if (!src || typeof src !== 'object') return base;
  for (const k in base){
    if (!(k in src)) continue;
    const bv = base[k], sv = src[k];
    if (Array.isArray(bv)){ if (Array.isArray(sv)) base[k] = bv.map((b, i) => sv[i] && typeof sv[i] === 'object' ? mergeDeep(clone(b), sv[i]) : b); }
    else if (bv && typeof bv === 'object') mergeDeep(bv, sv);
    else if (typeof sv === typeof bv) base[k] = sv;
  }
  return base;
}
function importSettings(json){
  if (!json || typeof json.sounds !== 'object'){ toast(t('notJson')); return; }
  if (json.mode === 'general' || json.mode === 'game'){ exportOpts.mode = json.mode; prefs.mode = json.mode; savePrefs(); updateExportBtn(); }
  let n = 0;
  for (const id in json.sounds){
    const e = json.sounds[id], bk = e.baked || {}, rt = e.runtime || {};
    const s = defaultSettings();
    if (typeof e.category === 'string') s.category = e.category;
    if (typeof e.note === 'string') s.note = e.note;
    mergeDeep(s.trim, bk.trim);
    for (const k of ['eq','filter','comp','dist','delay','reverb']) mergeDeep(s[k], bk[k]);
    mergeDeep(s.basic, rt); mergeDeep(s.rules, rt);
    if (rt.loop){ s.loop.enabled = typeof bk.loopEnabled === 'boolean' ? bk.loopEnabled : !!rt.loop.enabled; s.loop.start = (+rt.loop.start || 0) + s.trim.start; s.loop.end = (+rt.loop.end || 0) + s.trim.start; }
    const source = bk.source || (id + '.wav');
    let sd = sounds.find(x => x.id === id) || sounds.find(x => x.sourceName === source);
    if (sd){ sd.settings = s; if (sd.buffer){ s.trim.end = clamp(s.trim.end, 0.01, sd.duration); s.trim.start = clamp(s.trim.start, 0, s.trim.end - 0.01); } }
    else { sd = {id:uniqueId(sanitizeId(id)), sourceName:source, buffer:null, duration:Math.max(1, s.trim.end || 1), peaks:null, settings:s}; sounds.push(sd); }
    if (bk.library && typeof bk.library.id === 'string') sd.lib = {id:bk.library.id, file:bk.library.file || ''};
    n++;
  }
  renderList(); selectSound(sounds[0] || null); setDirty(false);
  if (sounds.length && typeof setSideTab === 'function') setSideTab('mine');
  const missLib = lib ? 0 : sounds.filter(x => !x.buffer && x.lib).length;
  const missing = sounds.filter(x => !x.buffer).length - missLib;
  toast(t('importDone', {n}) + (missing ? t('importMissing', {n:missing}) : '') + (missLib ? t('importLibMissing', {n:missLib}) : ''), 6000);
  if (lib) libAutoAttach();
}
async function bake(sd){
  const s = sd.settings, buf = sd.buffer, sr = buf.sampleRate, gen = general();
  const trimLen = s.trim.end - s.trim.start, rate = gen ? s.basic.pitch : 1;
  const total = trimLen/rate + tailOf(s);
  const oc = new OfflineAudioContext(2, Math.max(1, Math.ceil(total*sr)), sr);
  const src = oc.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
  const ch = buildChain(oc); applyParams(ch, s, false);
  src.connect(ch.input);
  if (gen){
    const pan = oc.createStereoPanner(), g = oc.createGain(), v = s.basic.volume;
    pan.pan.value = s.basic.pan; ch.output.connect(pan); pan.connect(g); g.connect(oc.destination);
    const fi = Math.min(s.basic.fadeIn, total), fo = Math.min(s.basic.fadeOut, total);
    g.gain.setValueAtTime(fi > 0 ? 0 : v, 0);
    if (fi > 0) g.gain.linearRampToValueAtTime(v, fi);
    if (fo > 0){ const st = Math.max(fi, total - fo); g.gain.setValueAtTime(v, st); g.gain.linearRampToValueAtTime(0, total); }
  } else ch.output.connect(oc.destination);
  src.start(0, s.trim.start, trimLen);
  return await oc.startRendering();
}
function encodeWAV(abuf){

  ws(36, 'data'); v.setUint32(40, n*nCh*bps, true);
  const chs = []; for (let c = 0; c < nCh; c++) chs.push(abuf.getChannelData(c));
  let o = 44, peak = 0;

async function makeZip(files, when = new Date()){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const dTime = (when.getHours() << 11) | (when.getMinutes() << 5) | (when.getSeconds() >> 1);
  const dDate = ((Math.max(1980, when.getFullYear()) - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate();
  for (const f of files){
    const name = enc.encode(f.name), data = new Uint8Array(await f.blob.arrayBuffer()), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dTime, true); lh.setUint16(12, dDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dTime, true); ch.setUint16(14, dDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);

function synthGunshot(c){
  const sr = c.sampleRate, pre = 0.45, body = 1.0, post = 0.55;
  const len = Math.floor((pre + body + post)*sr), off = Math.floor(pre*sr), n = Math.floor(body*sr);
  const b = c.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++){
    const d = b.getChannelData(ch); let lp = 0, lp2 = 0, ph = 0;
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*0.0002;
    for (let i = 0; i < n; i++){
      const tm = i/sr, nz = Math.random()*2 - 1;
      lp += (nz - lp)*0.06; lp2 += (lp - lp2)*0.2;
      ph += 2*Math.PI*(50 + 110*Math.exp(-tm*25))/sr;
      const v = nz*Math.exp(-tm*45)*0.6 + lp2*Math.exp(-tm*5)*2.2 + Math.sin(ph)*Math.exp(-tm*12)*0.75;
      d[off + i] += clamp(v*(ch ? 0.96 : 1), -0.95, 0.95);
    }
  }
  return b;
}
function synthBgm(c){
  const sr = c.sampleRate, bar = 2, chords = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const len = Math.floor(bar*chords.length*sr), b = c.createBuffer(2, len, sr);
  const Lc = b.getChannelData(0), Rc = b.getChannelData(1), mf = m => 440*Math.pow(2, (m - 69)/12);
  const note = (start, dur, freq, amp, tri, pan) => {
    const s0 = Math.floor(start*sr), n = Math.floor(dur*sr), inc = 2*Math.PI*freq/sr; let ph = 0;
    for (let i = 0; i < n && s0 + i < len; i++){
      const tm = i/sr, env = Math.min(1, tm/0.01)*Math.exp(-tm*3/dur); ph += inc;
      const v = (tri ? (2/Math.PI)*Math.asin(Math.sin(ph)) : Math.sin(ph))*amp*env;
      Lc[s0 + i] += v*(1 - pan); Rc[s0 + i] += v*(1 + pan);
    }
  };
  chords.forEach((cd, bi) => {
    const t0 = bi*bar;
    note(t0, bar, mf(cd[0] - 12), 0.28, false, 0);
    cd.forEach(m => note(t0, bar, mf(m), 0.06, false, 0));
    [0,1,2,1,0,1,2,1].forEach((p, k) => note(t0 + k*0.25, 0.4, mf(cd[p] + 12), 0.09, true, k % 2 ? 0.3 : -0.3));
  });
  return b;
}

  {t:['연습용 샘플 음원','Practice samples'], k:['샘플 연습 테스트 예제 음원 총소리 bgm','sample practice test demo gunshot music'],
   b:['Flow Music 파일이 없어도 기능을 시험해 볼 수 있게, 프로그램이 직접 합성한 샘플을 넣을 수 있어요. 목록에 <b>sample_</b>로 시작하는 이름으로 들어갑니다. 다시 누르면 처음 상태로 돌아갑니다.',
      'Try every feature without your own files: the app can synthesize practice sounds. They appear in the list as <b>sample_…</b>. Adding one again resets it.'],
   acts:[[['총소리 샘플 넣기','Add gunshot sample'], () => { closeHelp(); loadSample('gunshot'); }], [['루프 BGM 샘플 넣기','Add looping music sample'], () => { closeHelp(); loadSample('bgm'); }]]},
  {t:['음원 불러오기','Importing audio'], k:['추가 불러오기 드래그 끌어놓기 mp3 wav ogg 파일 열기 flow music','import add open drag drop mp3 wav ogg file flow music'], show:'#drop',
   tip:['파일을 여기로 끌어 놓거나, 위쪽 ＋ 음원 추가 버튼을 누르세요. 여러 개를 한 번에 넣을 수 있어요.','Drop files here or press ＋ Add audio at the top. You can add several at once.'],
   b:['음원 파일을 <b>화면 아무 곳</b>이나 왼쪽 목록 아래 점선 상자로 끌어 놓으세요. 위쪽 <b>＋ 음원 추가</b> 버튼으로 골라도 됩니다. 여러 파일을 한꺼번에 넣을 수 있어요.<br>15초 이상인 파일은 자동으로 <b>배경음악 + 루프</b>로, 짧은 파일은 <b>효과음</b>으로 분류됩니다(나중에 바꿀 수 있어요).',
      'Drop audio files <b>anywhere on the screen</b> or into the dashed box under the list, or use <b>＋ Add audio</b>. Several files at once is fine.<br>Files of 15 s or longer start as <b>music + loop</b>; shorter ones as <b>SFX</b> (you can change this).']},
  {t:['파형 보기 · 확대 · 이동','Waveform · zoom · scroll'], k:['파형 확대 축소 휠 스크롤 이동 줌 재생위치 클릭 전체 보기 원래 보기 선택 확대','waveform zoom wheel scroll pan playhead click show all back zoom selection'], show:'#wave',
   tip:['휠로 확대·축소, Shift+휠로 좌우 이동, 클릭하면 그 위치부터 재생해요.','Wheel to zoom, Shift+wheel to scroll, click to move the playhead.'],
   b:['<ul><li><b>마우스 휠</b>: 마우스 위치를 중심으로 확대·축소</li><li><b>Shift + 휠</b> 또는 파형 아래 슬라이더: 좌우 이동</li><li><b>클릭</b>: 재생 위치(흰 선) 옮기기</li><li><b>드래그</b>: 파란 선택 구간 만들기</li><li>파형 바로 아래 <b>＋ / －</b>: 확대 · 축소</li><li><b>선택 확대</b>: 드래그로 고른 구간을 화면 가득 → 확대되면 버튼이 <b>↩ 원래 보기</b>로 바뀌어요. 선택 확대로 들어갔으면 한 단계씩, 휠 · ＋로 확대했으면 바로 전체로 돌아가요 (<span class="kbd">Esc</span>도 같음)</li></ul>초록색 파형이 결과로 남는 부분이고, 어둡게 가려진 회색 부분은 잘려 나갑니다.',
      '<ul><li><b>Mouse wheel</b>: zoom around the pointer</li><li><b>Shift + wheel</b> or the slider below: scroll</li><li><b>Click</b>: move the playhead (white line)</li><li><b>Drag</b>: make a blue selection</li><li><b>＋ / －</b> right under the waveform: zoom in / out</li><li><b>Zoom selection</b>: fills the view with the dragged range; once zoomed the button becomes <b>↩ Back</b> — one step at a time after zooming a selection, straight to the whole sound after wheel or ＋ zoom (<span class="kbd">Esc</span> does the same)</li></ul>The green waveform is what you keep; the dimmed grey parts are trimmed away.']},
  {t:['재생 · 정지','Play · stop'], k:['재생 정지 스페이스 단축키 페이드 처음 듣기 플레이어 기본 재생','play stop space shortcut fade listen player basic playback'], show:'#zBasic',
   tip:['스페이스바로 재생·정지할 수 있어요.','Space toggles play/stop.'],
   b:['<b>▶ 재생</b>(<span class="kbd">Space</span>)은 흰 선 위치부터 재생합니다. 자르기 범위 밖에 있으면 자르기 시작점부터 재생해요. <b>⏮</b>는 시작점으로 돌아가기예요. 이 버튼들은 플레이어의 회색 <b>▶ 기본 재생</b> 칸에 있어요. 옆 파란 <b>🔍 효과 미리보기</b> 칸의 <b>⤵ 서서히 멈추기</b>는 페이드아웃 시간만큼 서서히 줄이며 멈춥니다(게임에서 정지할 때와 같은 동작).',
      '<b>▶ Play</b> (<span class="kbd">Space</span>) starts at the playhead, or at the trim start if the playhead is outside the trim. <b>⏮</b> returns to the start. These sit in the player’s grey <b>▶ Basic playback</b> box. In the blue <b>🔍 Effect preview</b> box next to it, <b>⤵ Fade out & stop</b> fades out over the fade-out time, just like a game stopping the sound.']},
  {t:['자르기 (앞뒤 잘라내기)','Trimming'], k:['자르기 트림 시작 끝 무음 앞뒤 길이 cut 잘라 구간','trim cut in out start end silence length region'], show:'.blk[data-id="region"]', tab:'region',
   tip:['구간 블록을 누르면 자르기 설정이 열려요. 파형의 빨간 선을 끌어도 됩니다.','Click the Region block to open trim settings, or drag the red lines on the waveform.'],
   b:['파형의 <b>빨간 선</b>(시작·끝)을 끌거나, 구간 설정창에 초 단위로 입력하세요. <b>앞뒤 무음 자동 제거</b>를 누르면 -50dB 이하의 조용한 앞뒤를 한 번에 잘라 줍니다. 효과음 앞에 무음이 남아 있으면 게임에서 소리가 늦게 나는 것처럼 느껴지니 꼭 잘라 주세요.<br>파형에서 드래그한 뒤 <b>선택 구간 → 자르기</b>를 눌러도 됩니다.',
      'Drag the <b>red lines</b> (in/out) or type seconds in the Region panel. <b>Auto-trim silence</b> removes quiet ends below -50 dB in one click — leftover silence makes game sounds feel late.<br>You can also drag a selection and press <b>Selection → trim</b>.']},
  {t:['루프 (반복 재생)','Looping'], k:['루프 반복 bgm 배경음악 이음새 loop 환경음 끊김','loop repeat music bgm seam ambience seamless'], show:'.blk[data-id="region"]', tab:'region',
   tip:['구간 설정창에서 루프를 켜고, 파형의 노란 선으로 반복 구간을 정하세요.','Turn on Loop in the Region panel and set the range with the yellow lines.'],
   b:['구간 설정창에서 <b>루프 재생</b>을 켜면 파형에 <b>노란 선</b>이 생겨요. 처음엔 0초부터 재생하다가 노란 끝선에 닿으면 노란 시작선으로 돌아가 반복합니다. 그래서 인트로가 있는 곡은 인트로 뒤에 루프 시작점을 두면 돼요.<br>재생해서 <b>이음새가 튀지 않는지</b> 꼭 들어 보세요. 리버브·딜레이를 켠 루프는 끝에서 잔향이 잘리므로 특히 확인이 필요합니다. 루프는 <b>게임용</b> 내보내기에서만 쓰여요.',
      'Turn on <b>Loop</b> in the Region panel and <b>yellow lines</b> appear. Playback starts at 0, and on reaching the yellow end it jumps back to the yellow start — so put the loop start after any intro.<br>Always listen for <b>clicks at the seam</b>, especially with reverb or delay (their tails get cut at the loop end). Loops are used only in <b>For games</b> exports.']},
  {t:['선택 구간 재생','Playing a selection'], k:['선택 드래그 구간 재생 반복 부분 일부','selection drag range play repeat part'], show:'#btnPlaySel',
   tip:['파형에서 드래그해 파란 구간을 만든 뒤 이 버튼을 누르세요. 계속 돌려 들으려면 🔁 반복 듣기.','Drag a blue range on the waveform, then press this. Use 🔁 Loop listen to keep it repeating.'],
   b:['파형에서 드래그하면 <b>파란 선택 구간</b>이 생깁니다. <b>▶ 선택 구간</b>은 그 부분만 한 번 재생하고, 효과 미리보기의 <b>🔁 반복 듣기</b>를 누르면 그 구간을 계속 돌려 들어요. 루프 이음새나 특정 소리만 집중해서 들을 때 편합니다. 선택 구간은 자르기나 루프 구간으로 바로 옮길 수 있어요.',
      'Dragging on the waveform makes a <b>blue selection</b>. <b>▶ Selection</b> plays just that part once, and <b>🔁 Loop listen</b> in Effect preview keeps repeating it — handy for checking a seam. A selection can be turned into the trim or loop range.']},
  {t:['🔍 효과 미리보기 · 📟 진행 상황','🔍 Effect preview · 📟 Status'], k:['효과 미리보기 진행 상황 반복 듣기 반복 루프 서서히 멈추기 페이드 정지 페이드아웃 랜덤 연타 쿨다운 재생 간격 겹침 파란 선','effect preview status loop listen repeat fade out stop fade stop random burst cooldown overlap blue line'], show:'#zPrev',
   tip:['게임에서 실제로 울릴 때처럼 들어 보는 버튼들이에요. 누르면 제목 옆 📟 진행 상황에 무슨 일인지 나와요.','Buttons for hearing the sound the way the game will play it. 📟 Status next to the title says what is happening.'],
   b:['플레이어의 파란 칸이에요. 파일은 바뀌지 않아요. 누른 버튼은 소리가 끝날 때까지 불이 켜지고, 제목 옆 <b>📟 진행 상황</b>에 지금 상황이 나와요(평소엔 「대기 중」 · 노란 테두리 = 이렇게 하면 돼요 안내 · 잘리면 마우스를 올려 전체 문장).<ul><li><b>🔁 반복 듣기</b>: 누르면 바로 재생하면서 계속 반복 — 범위 = 선택 구간 → (없으면) 구간 탭의 루프 → (없으면) 소리 전체. 파형 위에 반복 범위가 파란 띠로 보여요. 다시 누르면 멈춰요.</li><li><b>⤵ 서서히 멈추기 (n초)</b>: 게임이 소리를 끌 때처럼 볼륨 · 피치 탭의 <b>페이드아웃</b> 시간 동안 줄이며 멈춰요. 멈춰 있을 때 누르면 재생 → 1초 뒤 줄여요. 0초면 바로 멈춰요.</li><li><b>🎲 랜덤 1회</b>: 재생 규칙의 피치 · 볼륨 흔들기를 적용해 한 번 — 이번에 나온 값이 진행 상황에 나와요. 흔들기가 0이면 매번 같은 소리예요.</li><li><b>⚡ 연타 테스트</b>: 0.09초 간격으로 6번. 겹친 소리마다 파형 위에 파란 선이 움직이고, 동시 재생 제한을 넘으면 오래된 것부터 끊겨요. <b>재생 간격 제한</b>(쿨다운)이 있으면 일부는 무시돼요.</li></ul>🎵 원본을 듣는 중에 누르면 자동으로 🔊 결과로 바꿔서 들려줘요. 일반 음원 모드에선 재생 규칙을 쓰지 않아요.',
      'The blue box in the player; the file never changes. A pressed button stays lit until its sound ends, and <b>📟 Status</b> next to the title says what is happening (“Idle” otherwise · amber border = a hint · hover to read a cut-off line).<ul><li><b>🔁 Loop listen</b>: plays at once and keeps repeating — range = selection → (else) the loop from the Region tab → (else) the whole sound, shown as a blue band on the waveform. Press again to stop.</li><li><b>⤵ Fade out & stop (n s)</b>: fades out over the <b>Fade out</b> time from the Volume · Pitch tab, like a game turning the sound off. When nothing is playing it plays first and fades after 1 s. At 0 s it just stops.</li><li><b>🎲 Random once</b>: one play with the pitch/volume variation from Playback rules — this play’s values appear in Status. With variation 0 every play is identical.</li><li><b>⚡ Burst test</b>: six plays 0.09 s apart. Each overlapping copy is a blue line on the waveform; beyond the voice limit the oldest is cut. With a <b>cooldown</b>, some presses are ignored.</li></ul>Pressing any of these while hearing 🎵 Original switches to 🔊 Result. General-audio mode doesn’t use playback rules.']},
  {t:['🎵 원본 · 🔊 결과 비교','Original vs result'], k:['비교 원본 결과 적용 ab a/b 전후 차이 효과끄기 듣는중 키','compare original result processed ab a/b before after bypass key'], show:'.flow',
   tip:['재생하면서 🎵 원본 · 🔊 결과를 번갈아 누르면 그 자리에서 바꿔 들어요.','While playing, switch between 🎵 Original and 🔊 Result to compare in place.'],
   b:['다듬기 줄 양 끝의 두 키예요. <b>🎵 원본</b> = 다듬기 전 소리(효과 · 볼륨 · 피치 · 패닝 · 페이드 모두 끔), <b>🔊 결과</b> = 주황 · 파랑 탭을 모두 적용한 소리. 지금 듣는 쪽은 키가 눌려 들어가 빛나고, 플레이어 테두리 · 파형 색도 같이 바뀌어요(은회색 = 원본, 초록 = 결과).<ul><li><b>재생 중</b>에 누르면 그 자리에서 바뀌어요 — 처음부터 다시 틀지 않아요.</li><li><b>멈춰 있을 때</b> 누르면 고르기만 해요 — <b>▶ 재생</b>(<span class="kbd">Space</span>)으로 들어요.</li><li>원본을 듣는 중에 <b>🔍 효과 미리보기</b> 버튼을 누르면 자동으로 결과로 바뀌어요.</li></ul>',
      'The two keys at each end of the shaping row. <b>🎵 Original</b> = the sound before any changes (effects, volume, pitch, pan and fades all off); <b>🔊 Result</b> = with every orange and blue tab applied. The key you are hearing is pressed in and glows, and the player border and waveform colour follow (silver = original, green = result).<ul><li>Press one <b>while playing</b> to switch in place — it doesn’t restart.</li><li>Press one <b>while stopped</b> to just choose it — then press <b>▶ Play</b> (<span class="kbd">Space</span>).</li><li>Pressing any <b>🔍 Effect preview</b> button while hearing the original switches to the result.</li></ul>']},
  {t:['효과 탭 · 파일 반영과 게임 재생의 차이','Effect tabs · file vs playback'], k:['체인 탭 굽기 구움 반영 런타임 블록 순서 json wav 차이 주황 파랑','chain tabs baked bake applied file runtime block order json wav difference orange blue'], show:'#chain',
   tip:['주황 탭은 파일에 반영되고, 파랑 탭은 게임이 재생할 때 json 값으로 적용해요. ● = 켜짐 · ○ = 꺼짐.','Orange tabs go into the file; blue tabs are applied by the game from the json. ● on · ○ off.'],
   b:['소리는 탭을 <b>왼쪽에서 오른쪽 순서</b>로 지나갑니다. 탭을 누르면 아래에 그 단계의 설정이 열려요. 탭 이름 앞 <b>●</b>는 켜짐, <b>○</b>는 꺼짐이에요.<ul><li><b>주황 탭 💾</b>: 구간·EQ·필터·컴프레서·디스토션·딜레이·리버브 — 저장할 때 <b>파일 안에 반영됩니다</b>.</li><li><b>파랑 탭 ▶</b>: 볼륨·피치·패닝·페이드·재생 규칙 — 게임용 모드에서는 <b>sound_settings.json</b>에 저장되고 게임이 재생할 때 적용해요. 일반 음원 모드에서는 볼륨·피치·패닝·페이드도 파일에 반영돼요.</li></ul>「🎛 이 소리 다듬기」 줄 오른쪽 위에 색의 뜻이 적혀 있어요.',
      'Sound flows through the tabs <b>left to right</b>. Click a tab to open its settings below. <b>●</b> before a name means on, <b>○</b> off.<ul><li><b>Orange tabs 💾</b>: region, EQ, filter, compressor, distortion, delay, reverb — <b>applied to the file</b> when you save.</li><li><b>Blue tabs ▶</b>: volume, pitch, pan, fades, rules — in game mode they are saved in <b>sound_settings.json</b> and applied by the game at playback. In general-audio mode volume, pitch, pan and fades go into the file too.</li></ul>The colour key sits at the top right of the “🎛 Shape this sound” row.']},
  {t:['EQ (음색 조절)','EQ (tone)'], k:['eq 이퀄라이저 저음 고음 중음 음색 쉘프 주파수 베이스 쨍','eq equalizer bass treble mid tone shelf frequency harsh boomy'], show:'.blk[data-id="eq"]', tab:'eq',
   tip:['그래프의 노란 점을 끌어서 바로 조절할 수 있어요.','Drag the yellow dots on the graph.'],
   b:['5개 밴드로 저음~고음의 크기를 조절합니다. 그래프의 <b>노란 점</b>을 끌면 좌우로 주파수, 위아래로 크기가 바뀌어요.<ul><li>둔탁하게 묻힌다 → 저중음(300Hz 근처)을 살짝 낮추기</li><li>힘이 없다 → 저음 쉘프 올리기</li><li>귀가 아프게 쨍하다 → 고중음(3~5kHz) 낮추기</li></ul>',
      'Five bands shape lows to highs. Drag the <b>yellow dots</b>: left/right = frequency, up/down = gain.<ul><li>Muddy → cut low-mids (~300 Hz) a little</li><li>Weak → raise the low shelf</li><li>Harsh → cut high-mids (3–5 kHz)</li></ul>']},
  {t:['필터 (하이패스 · 로우패스)','Filter (high-pass · low-pass)'], k:['필터 하이패스 로우패스 먹먹 물속 얇게 무전기 벽너머 멀리','filter highpass lowpass muffled underwater thin radio wall distant'], show:'.blk[data-id="filter"]', tab:'filter',
   tip:['로우패스를 낮추면 먹먹해지고, 하이패스를 올리면 얇아져요.','Lower the low-pass to muffle; raise the high-pass to thin out.'],
   b:['<b>로우패스</b>를 낮추면 고음이 깎여 먹먹해져요(물속, 벽 너머). <b>하이패스</b>를 올리면 저음이 깎여 얇아집니다(무전기, 작은 스피커). 둘을 함께 쓰면 전화·라디오 소리가 됩니다. Q를 올리면 경계 부분이 강조돼 특유의 색이 생겨요.',
      'Lowering the <b>low-pass</b> removes highs — muffled, underwater, behind a wall. Raising the <b>high-pass</b> removes lows — thin, like a radio or tiny speaker. Both together = telephone. Higher Q adds a resonant edge.']},
  {t:['컴프레서 (크기 고르게)','Compressor'], k:['컴프레서 압축 크기 고르게 펀치 감쇄 메이크업 다이나믹','compressor compression even level punch reduction makeup dynamics'], show:'.blk[data-id="comp"]', tab:'comp',
   tip:['오른쪽 📈 소리 모양의 주황 막대가 얼마나 눌리는지 보여 줘요.','The orange bar in 📈 Sound shape shows the gain reduction.'],
   b:['기준 레벨보다 큰 소리를 비율만큼 눌러서 크기 차이를 줄입니다. 효과음을 단단하고 앞으로 튀어나오게 만들 때 써요. 눌린 만큼 작아지니 <b>메이크업 게인</b>으로 다시 키워 주세요. 어택을 조금 늦추면(5~20ms) 타격감이 살아나요.',
      'Squeezes anything above the threshold by the ratio, evening out the level and making SFX solid and forward. Restore loudness with <b>makeup gain</b>. A slightly slower attack (5–20 ms) keeps the punch.']},
  {t:['디스토션 (찌그러뜨리기)','Distortion'], k:['디스토션 찌그러짐 왜곡 거칠게 폭발 드라이브 레트로 강하게','distortion distorted overdrive gritty explosion drive retro'], show:'.blk[data-id="dist"]', tab:'dist',
   tip:['드라이브를 올리면 거칠어지고, 톤으로 지저분한 고음을 정리해요.','More drive = more grit; Tone tames the fizz.'],
   b:['일부러 소리를 찌그러뜨려 거칠고 강하게 만듭니다. 폭발·충격음, 무전기, 레트로 게임기 느낌에 좋아요. <b>섞는 양</b>을 낮추면 원래 소리에 살짝만 더해집니다. 의도하지 않은 찌그러짐은 "클리핑 경고" 항목을 보세요.',
      'Deliberate distortion for grit and power — explosions, impacts, radio, retro consoles. Lower <b>Mix</b> to blend it in subtly. For unwanted distortion, see “Clipping warning”.']},
  {t:['딜레이 (메아리)','Delay (echo)'], k:['딜레이 메아리 에코 반복 산 울림','delay echo repeat'], show:'.blk[data-id="delay"]', tab:'delay',
   tip:['간격과 피드백으로 메아리의 박자와 길이를 정해요.','Time and feedback set the echo rhythm and length.'],
   b:['소리가 <b>간격</b>마다 반복됩니다. <b>피드백</b>이 클수록 오래 반복돼요. 루프가 아닌 소리는 메아리가 끝날 때까지 파일 길이가 자동으로 늘어납니다.',
      'The sound repeats every <b>Time</b>; more <b>Feedback</b> means longer repeats. Non-looping sounds are extended automatically to fit the echo tail.']},
  {t:['리버브 (공간 울림)','Reverb (space)'], k:['리버브 잔향 울림 동굴 공간 홀 꼬리 성당 방','reverb room hall cave space tail cathedral ambience'], show:'.blk[data-id="reverb"]', tab:'reverb',
   tip:['잔향 길이가 길수록 넓은 공간, 고음 감쇠가 낮을수록 부드러운 울림이에요.','Longer decay = bigger space; lower damping = softer tail.'],
   b:['소리가 공간에 울리는 느낌을 더합니다. <b>잔향 길이</b> 0.5~1초는 작은 방, 2~3초는 홀, 4초 이상은 동굴·성당 느낌이에요. <b>프리딜레이</b>를 조금 주면 원래 소리가 또렷하게 남습니다. 리버브는 가장 무거운 효과라, 끈 상태에서는 계산하지 않게 해 두었어요.',
      'Adds the sense of a space. <b>Decay</b> 0.5–1 s ≈ small room, 2–3 s ≈ hall, 4 s+ ≈ cave or cathedral. A little <b>pre-delay</b> keeps the dry sound clear. Reverb is the heaviest effect, so it is fully off when disabled.']},
  {t:['볼륨 · 피치 · 패닝 · 페이드','Volume · pitch · pan · fades'], k:['볼륨 소리크기 피치 음높이 속도 패닝 좌우 페이드 인 아웃 db 반음','volume loudness pitch speed pan left right fade in out db semitone'], show:'.blk[data-id="basic"]', tab:'basic',
   tip:['게임용 모드에서는 json에 저장되고, 일반 음원용 모드에서는 파일에 반영돼요.','Saved in the json in game mode; applied to the file in general-audio mode.'],
   b:['<ul><li><b>볼륨</b>: 1 = 원래 크기, 옆에 dB로도 표시</li><li><b>높이 · 길이</b>: 올리면 높아지면서 짧아지고, 내리면 낮아지면서 길어져요</li><li><b>패닝</b>: 왼쪽(-1) ~ 오른쪽(1)</li><li><b>페이드인</b>: 시작 때 서서히 커짐</li><li><b>페이드아웃</b>: 게임용 = 게임이 정지할 때, 일반 음원용 = 파일 끝부분</li></ul>',
      '<ul><li><b>Volume</b>: 1 = unchanged, also shown in dB</li><li><b>Pitch · length</b>: higher is also shorter, lower is also longer</li><li><b>Pan</b>: left (-1) to right (1)</li><li><b>Fade in</b>: rises at the start</li><li><b>Fade out</b>: games = when the game stops the sound; general audio = at the end of the file</li></ul>']},
  {t:['재생 규칙 (랜덤 · 동시 재생 · 쿨다운)','Playback rules (random · voices · cooldown)'], k:['랜덤 흔들기 연타 동시재생 쿨다운 반복티 연사 메모 발소리 총소리','random variation burst voices polyphony cooldown repetition footsteps gunshot notes'], show:'.blk[data-id="rules"]', tab:'rules',
   tip:['피치를 조금 흔들고 연타 테스트로 들어 보세요.','Add a little pitch variation and try the burst test.'],
   b:['<ul><li><b>피치·볼륨 흔들기</b>: 재생할 때마다 값을 조금씩 바꿔 같은 소리의 반복 티를 없애요. 발소리·총소리는 피치 ±5~10%가 무난합니다.</li><li><b>최대 동시 재생</b>: 같은 소리가 동시에 몇 개까지 겹칠 수 있는지. 넘으면 가장 오래된 것을 끊어요.</li><li><b>재생 간격 제한</b>: 이 시간 안에 들어온 재생 요청은 무시해요.</li></ul>플레이어의 <b>🔍 효과 미리보기</b>에서 <b>🎲 랜덤 1회</b>, <b>⚡ 연타 테스트</b>로 확인하세요. 게임용 전용 기능이에요.',
      '<ul><li><b>Pitch/volume random</b>: varies each play to hide repetition — ±5–10 % pitch suits footsteps and gunshots.</li><li><b>Max voices</b>: how many copies may overlap; the oldest is stopped beyond that.</li><li><b>Cooldown</b>: play requests within this time are ignored.</li></ul>Check with <b>🎲 Random once</b> and <b>⚡ Burst test</b> in the player’s <b>🔍 Effect preview</b>. Game mode only.']},
  {t:['프리셋','Presets'], k:['프리셋 동굴 무전기 라디오 물속 멀리 펀치 레트로 초기화 빠르게','preset cave radio underwater far punch retro reset quick'], show:'#preset',
   tip:['고르면 파일에 반영되는 효과들이 한 번에 설정돼요. 구간·볼륨·재생 규칙은 그대로 남아요.','Sets the file effects in one go; region, volume and rules stay as they are.'],
   b:['자주 쓰는 효과 조합을 한 번에 적용합니다: 동굴, 작은 방, 무전기·라디오, 물속, 멀리서 들림, 펀치감 효과음, 레트로 게임기. 적용 후 슬라이더로 다듬으면 돼요. <b>효과 전체 초기화</b>로 처음 상태로 돌릴 수 있어요.',
      'Applies a ready-made effect combo: cave, small room, radio, underwater, far away, punchy SFX, retro console. Fine-tune with the sliders afterwards; <b>Reset all effects</b> starts over.']},
  {t:['ID와 분류','ID and category'], k:['id 이름 파일명 분류 카테고리 bgm sfx ui 호출','id name file name category bgm sfx ui call'], show:'#soundId',
   tip:['ID는 게임에서 부를 이름이자 파일 이름이에요.','The ID is the name the game calls and the file name.'],
   b:['<b>ID</b>는 게임 코드에서 이 소리를 부르는 이름이자 내보낼 파일 이름(<b>ID.wav</b>)입니다. 영문 소문자·숫자·_ 만 쓸 수 있어요. 예: <b>gun_pistol_fire</b>, <b>bgm_dungeon</b>.<br><b>분류</b>는 게임의 볼륨 옵션(배경음 볼륨, 효과음 볼륨)을 따로 두기 위한 묶음이에요.',
      'The <b>ID</b> is how game code calls the sound and the exported file name (<b>ID.wav</b>): a–z, 0–9 and _ only, e.g. <b>gun_pistol_fire</b>, <b>bgm_dungeon</b>.<br>The <b>category</b> groups sounds for separate volume sliders (music, SFX…).']},
  {t:['설정 저장 · 불러오기 (이어서 작업)','Saving and reopening settings'], k:['저장 불러오기 json 이어서 작업 설정 백업 다시','save open load json continue settings backup'], show:'#btnSaveJson',
   tip:['설정만 json으로 저장해요. 다음에 불러온 뒤 원본 음원을 끌어 놓으면 이어서 작업할 수 있어요.','Saves settings only. Reopen it later and drop the source audio to continue.'],
   b:['<b>설정 저장</b>은 모든 사운드의 설정을 <b>sound_settings.json</b> 하나로 저장합니다(음원 자체는 들어가지 않아요). 다음에 <b>설정 불러오기</b>로 열고 <b>원본 음원 파일을 끌어 놓으면</b> 파일 이름으로 자동 연결돼 이어서 작업할 수 있어요. 저장하지 않은 변경이 있으면 제목 옆에 노란 점이 보입니다.',
      '<b>Save settings</b> writes every sound’s settings to one <b>sound_settings.json</b> (no audio inside). Later, <b>Open settings</b> and <b>drop the original audio files</b> — they are matched by file name. A yellow dot by the title means unsaved changes.']},
  {t:['내보내기 · 파일로 저장','Exporting and saving'], k:['내보내기 굽기 반영 저장 wav 베이크 export 저장 결과 파일 zip 압축 묶음','export bake wav save output file render zip archive bundle'], show:'#btnExportAll',
   tip:['모든 소리 파일과 sound_settings.json을 zip 하나로 만들어요. 옆의 ⚙에서 용도와 MP3를 고릅니다.','Packs every sound file plus sound_settings.json into one zip. Use ⚙ next to it for purpose and MP3.'],
   b:['<ul><li><b>💾 이 소리 파일로 저장</b>: 지금 보고 있는 소리만 효과를 반영해 저장</li><li><b>전체 내보내기</b>: 모든 소리 + <b>sound_settings.json</b>을 <b>zip 파일 하나</b>(<b>sounds_날짜_시각.zip</b>, 예: sounds_2026-11-04_1610.zip)로 받아요. 압축을 풀어 게임의 <b>sounds/</b> 폴더에 넣으면 됩니다.</li><li><b>📁 저장 폴더</b>를 정해 두었으면(크롬 · 엣지) zip 대신 그 폴더에 파일들이 바로 저장돼요.</li></ul>버튼의 🎮/🎵 표시는 지금 용도(게임용/일반 음원용)이고, <b>+MP3</b>가 보이면 MP3도 함께 들어갑니다.',
      '<ul><li><b>💾 Save this sound as a file</b>: saves just the sound you are viewing</li><li><b>Export all</b>: every sound + <b>sound_settings.json</b> in <b>one zip file</b> (<b>sounds_date_time.zip</b>, e.g. sounds_2026-11-04_1610.zip). Unzip it into your game’s <b>sounds/</b> folder.</li><li>If a <b>📁 Save folder</b> is set (Chrome, Edge), the files go straight into that folder instead of a zip.</li></ul>The 🎮/🎵 on the button shows the purpose (games / general audio); <b>+MP3</b> means MP3 copies are included too.']},
  {t:['내보내기 용도: 게임용 vs 일반 음원용','Export purpose: games vs general audio'], k:['용도 게임용 일반 음원 영상 릴스 유튜브 감상 모드 굽기 반영 볼륨 페이드','purpose game general audio video reels youtube listening mode bake volume fade'], show:'#btnExpOpt',
   tip:['⚙에서 용도를 고르세요. 일반 음원용은 볼륨·피치·패닝·페이드까지 파일에 반영해요.','Choose the purpose in ⚙. General audio applies volume, pitch, pan and fades to the file.'],
   b:['<ul><li><b>🎮 게임용</b>: 볼륨·피치·패닝·페이드·루프·재생 규칙은 json에만 저장되고, 게임이 재생할 때 적용합니다. 파일에는 효과만 반영돼요.</li><li><b>🎵 일반 음원용</b>: 영상 배경음악, 릴스, 감상용처럼 <b>파일 하나로 완성</b>되어야 할 때. 볼륨·피치·패닝·페이드까지 파일에 반영되고, 페이드아웃은 파일 끝부분에 들어갑니다. 루프와 재생 규칙은 쓰이지 않아요.</li></ul>모드를 바꾸면 효과 체인의 색과 미리듣기도 그 모드에 맞게 바뀝니다.',
      '<ul><li><b>🎮 For games</b>: volume, pitch, pan, fades, loop and rules stay in the json for the game to apply; only effects go into the file.</li><li><b>🎵 General audio</b>: when the <b>file must be finished on its own</b> — video music, reels, listening. Volume, pitch, pan and fades go into the file, with the fade-out at the end of the file. Loop and rules are not used.</li></ul>Switching mode also updates the chain colours and the preview.']},
  {t:['MP3 보조 저장','MP3 extra copy'], k:['mp3 보조 저장 변환 용량 공유 미리듣기 kbps 음질','mp3 extra copy convert size share preview kbps quality'], show:'#btnExpOpt',
   tip:['⚙에서 "MP3도 함께 저장"을 켜면 WAV와 함께 MP3가 저장돼요.','Turn on “Also save an MP3” in ⚙ to get an MP3 next to each WAV.'],
   b:['<b>WAV</b>가 기본 저장(원본 품질, 작업·게임용)이고, <b>MP3는 보조 저장</b>이에요. 지인에게 들려주기, 메신저로 보내기, 미리듣기처럼 <b>작은 파일</b>이 필요할 때 켜세요. 음질은 128~320kbps 중 고를 수 있고 192kbps면 충분합니다.<br>⚠ 루프 소리에는 MP3를 쓰지 마세요. MP3는 앞뒤에 아주 짧은 무음이 끼어 이음새가 어긋나요. 게임에는 WAV(또는 OGG)를 쓰세요.<br>오래된 노트북에서는 3분짜리 곡 변환에 몇십 초가 걸릴 수 있어요.',
      '<b>WAV</b> is the main file (full quality, for editing and games); <b>MP3 is an extra copy</b> for sharing, messaging and previews where a <b>small file</b> matters. Choose 128–320 kbps; 192 kbps is plenty.<br>⚠ Don’t use MP3 for loops — the format adds tiny gaps that break the seam. Use WAV (or OGG) in games.<br>On older laptops a 3-minute track can take tens of seconds to encode.']},
  {t:['저장 폴더 지정 (바로 저장)','Save folder (direct saving)'], k:['폴더 지정 크롬 엣지 바로저장 다운로드 경로 sounds','folder chrome edge direct save download path sounds'], show:'#btnPickDir',
   tip:['게임의 sounds 폴더를 지정하면 다운로드를 거치지 않고 바로 저장돼요.','Pick your game’s sounds folder to save there directly.'],
   b:['크롬·엣지에서 <b>📁 저장 폴더 지정</b>으로 폴더를 고르면, 이후 파일 저장·내보내기·설정 저장이 다운로드 대신 그 폴더에 바로 저장됩니다. 게임 프로젝트의 <b>sounds</b> 폴더를 고르면 편해요. 페이지를 새로 열면 다시 지정해야 해요.',
      'In Chrome or Edge, <b>📁 Save folder</b> lets later saves, exports and settings go straight into that folder instead of Downloads — pick your game’s <b>sounds</b> folder. You need to pick it again after reloading the page.']},
  {t:['클리핑 경고 (의도치 않은 찌그러짐)','Clipping warning'], k:['클리핑 찌그러짐 경고 너무큼 빨간 레벨 db 깨짐 터짐','clipping distorted warning too loud red level db crackle'], show:'#meter',
   tip:['출력 레벨 막대가 빨갛게 되면 너무 큰 거예요.','A red output bar means it is too loud.'],
   b:['소리가 최대 크기(0dB)를 넘으면 잘려서 찌그러집니다. 오른쪽 <b>출력 레벨</b> 막대가 빨갛게 되거나, 저장 후 <b>⚠ 클리핑</b> 경고가 뜨면 볼륨·EQ 게인·컴프 메이크업 게인을 낮추고 다시 저장하세요.',
      'Anything above full scale (0 dB) gets clipped and distorts. If the <b>output level</b> bar turns red or a <b>⚠ Clipping</b> warning appears after saving, lower the volume, EQ gains or makeup gain and save again.']},

const HELP_TAGS = [['따라하기','tutorial'],['자르기','trim'],['루프','loop'],['EQ','EQ'],['리버브','reverb'],['컴프레서','compressor'],['랜덤','random'],['프리셋','preset'],['내보내기','export'],['MP3','MP3'],['일반 음원','general'],['찌그러짐','clipping'],['Godot','Godot'],['단축키','shortcut']];
const escHtml = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stripHtml = h => h.replace(/<[^>]+>/g, ' ');
function markTerms(node, terms){
  if (!terms.length) return;
  const re = new RegExp('(' + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(tn => {
    if (!re.test(tn.nodeValue)) return; re.lastIndex = 0;
    const span = document.createElement('span'); span.innerHTML = escHtml(tn.nodeValue).replace(re, '<mark>$1</mark>');
    tn.replaceWith(...span.childNodes);
  });
}
function renderHelpTags(){
  const tags = $('#helpTags'); tags.innerHTML = '';
  HELP_TAGS.forEach(tg => tags.append(btn(L(tg), () => { $('#helpQ').value = L(tg); renderHelp(L(tg)); })));
}
function renderHelp(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = $('#helpList'); list.innerHTML = '';
  const items = HELP.map(h => {
    const hay = (h.t.join(' ') + ' ' + h.k.join(' ') + ' ' + stripHtml(L(h.b))).toLowerCase();
    if (terms.length && !terms.every(x => hay.includes(x))) return null;
    let sc = h.pin && !terms.length ? 100 : 0;
    terms.forEach(x => { if (L(h.t).toLowerCase().includes(x)) sc += 3; if (h.k.join(' ').toLowerCase().includes(x)) sc += 2; });
    return {h, sc};
  }).filter(Boolean).sort((a, b) => b.sc - a.sc);
  if (!items.length){ list.innerHTML = '<div class="noresult">' + escHtml(t('noresult', {q})) + '</div>'; return; }
  items.forEach(({h}, idx) => {
    const d = el('details', 'topic' + (h.pin ? ' pin' : ''));
    if (terms.length ? idx < 2 : h.pin) d.open = true;
    const sm = el('summary', null, L(h.t)); d.append(sm);
    const tb = el('div', 'tb'); tb.innerHTML = L(h.b);
    markTerms(sm, terms); markTerms(tb, terms);
    const act = el('div', 'tact');
    if (h.show) act.append(btn(t('showOnScreen'), () => showOnScreen(h)));
    (h.acts || []).forEach(a => act.append(btn(L(a[0]), a[1])));
    if (act.children.length) tb.append(act);
    d.append(tb); list.append(d);
  });
}
function openHelp(q = ''){ $('#expPop').hidden = true; $('#helpModal').hidden = false; $('#helpQ').value = q; renderHelp(q); setTimeout(() => $('#helpQ').focus(), 30); }
function closeHelp(){ $('#helpModal').hidden = true; }
function showOnScreen(h){
  closeHelp();
  const always = ['#drop', '.langseg'].includes(h.show) || h.show.startsWith('#btn');
  if (!cur && !always){ loadSample('gunshot'); toast(t('sampleForShow')); }
  if (h.show === '#btnExpOpt'){ renderExpPop(); $('#expPop').hidden = false; }
  startTour(['도움말','Help'], [{target:h.show === '#btnExpOpt' ? '.expwrap' : h.show, before:h.tab ? () => openTab(h.tab) : null, title:h.t, text:h.tip || h.t}]);
}

const tour = {steps:null, i:0, timer:null, flags:{}, title:'', id:''};
function tourFlag(k){ tour.flags[k] = true; }
function getTarget(st){
  const tg = typeof st.target === 'function' ? st.target() : (st.target ? document.querySelector(st.target) : null);
  if (!tg) return null;
  const r = tg.getBoundingClientRect();
  return r.width > 0 && r.height > 0 ? tg : null;
}
function placeTour(){
  if (!tour.steps) return;
  const st = tour.steps[tour.i], sp = $('#tourSpot'), bb = $('#tourBubble');
  const W = innerWidth, H = innerHeight, bw = bb.offsetWidth, bh = bb.offsetHeight, tg = getTarget(st);
  if (!tg){
    sp.classList.add('center');
    Object.assign(sp.style, {left:W/2 + 'px', top:H/2 + 'px', width:'0px', height:'0px'});
    bb.style.left = (W - bw)/2 + 'px'; bb.style.top = Math.max(12, (H - bh)/2) + 'px';
    return;
  }
  sp.classList.remove('center');
  const r = tg.getBoundingClientRect(), pad = 6;
  const x = Math.max(4, r.left - pad), y = Math.max(4, r.top - pad);
  const w = Math.min(W - 4, r.right + pad) - x, h = Math.min(H - 4, r.bottom + pad) - y;
  Object.assign(sp.style, {left:x + 'px', top:y + 'px', width:w + 'px', height:h + 'px'});
  let top, left = null;
  if (y + h + 12 + bh <= H) top = y + h + 12;
  else if (y - 12 - bh >= 0) top = y - 12 - bh;
  else {
    top = clamp(y, 12, H - bh - 12);
    if (x + w + 12 + bw <= W) left = x + w + 12;
    else if (x - 12 - bw >= 0) left = x - 12 - bw;
    else { left = W - bw - 16; top = H - bh - 16; }
  }
  if (left === null) left = clamp(x, 12, W - bw - 12);
  bb.style.left = left + 'px'; bb.style.top = top + 'px';
}
function startTour(title, steps, id){
  closeHelp(); clearInterval(tour.timer);
  Object.assign(tour, {steps, i:0, flags:{}, title, id:id || ''});
  showStep();
}
function endTour(done){
  clearInterval(tour.timer);
  if (done === true && tour.id === 'gunshot'){ prefs.tourDone = true; savePrefs(); $('#btnTour').classList.remove('glow'); }
  tour.steps = null;
  $('#tourSpot').hidden = true; $('#tourBubble').hidden = true;
  if (done === true) toast(t('tourFinished'));
}
function showStep(langOnly){
  clearInterval(tour.timer);
  const st = tour.steps[tour.i], n = tour.steps.length;
  if (!langOnly){ st._done = false; try { if (st.before) st.before(); } catch(e){ console.error(e); } }
  const bb = $('#tourBubble'), w = bb.querySelector('.twait'), next = $('#tNext');
  bb.querySelector('.tstep').textContent = n > 1 ? L(tour.title) + ' · ' + (tour.i + 1) + ' / ' + n : L(tour.title);
  bb.querySelector('.ttitle').textContent = L(st.title);
  bb.querySelector('.ttext').innerHTML = L(st.text);
  if (st.wait){ w.hidden = false; w.className = 'twait' + (st._done ? ' done' : ''); w.textContent = st._done ? t('tGood') : t('tWait'); } else w.hidden = true;
  $('#tPrev').hidden = n === 1; $('#tPrev').disabled = tour.i === 0; $('#tSkip').hidden = n === 1;
  next.textContent = n === 1 ? t('tClose') : tour.i === n - 1 ? t('tDone') : (st.wait && !st._done) ? t('tSkipStep') : t('tNext');
  $('#tourSpot').hidden = false; bb.hidden = false;
  requestAnimationFrame(() => { const tg = getTarget(st); if (tg && !langOnly) tg.scrollIntoView({block:'nearest', inline:'nearest'}); placeTour(); });
  tour.timer = setInterval(() => {
    if (!tour.steps || tour.steps[tour.i] !== st) return;
    placeTour();
    if (st.wait && !st._done){
      let ok = false; try { ok = st.wait(); } catch(e){}
      if (ok){
        st._done = true; w.className = 'twait done'; w.textContent = t('tGood'); next.textContent = t('tNext');
        setTimeout(() => { if (tour.steps && tour.steps[tour.i] === st) nextStep(); }, 900);
      }
    }
  }, 250);
}
function nextStep(){ if (!tour.steps) return; if (tour.i >= tour.steps.length - 1) return endTour(tour.steps.length > 1); tour.i++; showStep(); }
function prevStep(){ if (tour.steps && tour.i > 0){ tour.i--; showStep(); } }

const libIdb = {
  db(){ return new Promise((res, rej) => { const r = indexedDB.open('swb_lib', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ try { const d = await this.db(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch(e){ return null; } },
  async set(k, v){ try { const d = await this.db(); await new Promise(res => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch(e){} }
};

const libTxt = o => o ? (lang === 'en' ? (o.en || o.ko) : (o.ko || o.en)) : '';
function libCatName(id){ const c = lib && lib.tax && lib.tax.cat.get(id); return c ? libTxt(c) : id; }
function libRoleName(id){ const r = lib && lib.tax && lib.tax.role.get(id); return r ? libTxt(r) : id.replace(/_/g, ' '); }
function libMoodName(id){ const m = lib && lib.tax && lib.tax.mood.get(id); return m ? libTxt(m) : id; }
function libUsage(){ return (lib && lib.tax && lib.tax.usage.length) ? lib.tax.usage : [{id:'game', emoji:'🎮', ko:'게임', en:'Game'}, {id:'film', emoji:'🎬', ko:'영화', en:'Film'}, {id:'life', emoji:'🏠', ko:'드라마 · 생활', en:'Drama · Life'}]; }
function libToId(id){
  const p = String(id).split('_');
  const fx = p.slice(1).join('_').replace(/([a-z])([A-Z])/g, '$1_$2').replace(/([A-Za-z])(\d)/g, '$1_$2');
  return sanitizeId(p[0].toLowerCase() + (fx ? '_' + fx : ''));
}

async function libDirGet(dir, path){
  const parts = path.split('/'); let d = dir;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
  return await (await (await d.getFileHandle(parts[parts.length - 1])).getFile()).arrayBuffer();
}
async function libReadRoot(src, path){
  if (src.kind === 'dir') return await libDirGet(src.handle, path);
  if (src.kind === 'files'){ const f = src.files.get(path); if (!f) throw new Error(path); return await f.arrayBuffer(); }
  const r = await fetch(src.base + path.split('/').map(encodeURIComponent).join('/'), {cache:'no-cache'});
  if (!r.ok) throw new Error(path + ' (' + r.status + ')');
  return await r.arrayBuffer();
}
async function libReadJson(src, path, optional){
  try { return JSON.parse(new TextDecoder().decode(await libReadRoot(src, path))); }
  catch(e){ if (optional) return null; throw e; }
}
const libReadSound = (item) => libReadRoot(lib, 'sounds/' + item.file);

async function libLoad(src){
  toast(t('libLoading'), 15000);
  try {
    let catalog;
    try { catalog = await libReadJson(src, 'catalog.json'); }
    catch(e){ throw new Error(src.kind === 'url' ? (e.message || 'catalog.json') : t('libNoCatalog')); }
    if (!catalog || catalog.format !== 'tib-sound-library' || !Array.isArray(catalog.sounds)) throw new Error(t('libNotCatalog'));
    const taxJ = await libReadJson(src, 'taxonomy.json', true);
    const tax = {usage:[], cat:new Map(), role:new Map(), mood:new Map(), roleGroups:[]};
    if (taxJ){
      tax.usage = taxJ.usage || [];
      (taxJ.categories || []).forEach(c => tax.cat.set(c.id, c));
      (taxJ.roles || []).forEach(r => tax.role.set(r.id, r));
      tax.roleGroups = taxJ.roleGroups || [];
      for (const ax of ['world', 'texture']) ((taxJ.moods || {})[ax] || []).forEach(m => tax.mood.set(m.id, Object.assign({axis:ax}, m)));
    }
    stopLibPreview(); libCache.clear(); libOpen.clear();
    lib = Object.assign({}, src, {catalog, tax, name: src.name || 'library'});
    lib.items = catalog.sounds.filter(s => s && s.id && s.file);
    lib.byId = new Map(lib.items.map(s => [s.id, s]));
    lib.items.forEach(s => { s._w = (s.moods && s.moods.world) || []; s._x = (s.moods && s.moods.texture) || []; });
    libResetFilters(false);
    if (src.kind === 'dir'){ prefs.libKind = 'dir'; libIdb.set('dir', src.handle); }
    else if (src.kind === 'url'){ prefs.libKind = 'url'; prefs.libUrl = src.base; }
    else prefs.libKind = 'files';
    prefs.libName = lib.name; savePrefs();
    libShowBody(); libRenderFilters(); libRender(); updateSideTabs();
    toast(t('libLoaded', {name:lib.name, n:lib.items.length}), 3500);
    libAutoAttach();
  } catch(e){
    console.error(e); toast(t('libLoadFail', {m:e.message || e}), 6000);
  }
}
async function libOpenDirPick(){
  if (window.showDirectoryPicker){
    let h;
    try { h = await window.showDirectoryPicker({mode:'read', id:'swb-library'}); }
    catch(e){ if (e.name !== 'AbortError') toast(t('libLoadFail', {m:e.message})); return; }
    try { await h.getFileHandle('catalog.json'); }
    catch(e){
      let found = null;
      for await (const [n, c] of h.entries()){ if (c.kind === 'directory'){ try { await c.getFileHandle('catalog.json'); found = c; break; } catch(_){} } }
      if (!found){ toast(t('libNoCatalog'), 6000); return; }
      h = found;
    }
    await libLoad({kind:'dir', handle:h, name:h.name});
  } else $('#libDirInput').click();
}
async function libOpenFiles(fileList){
  const files = [...fileList]; if (!files.length) return;
  const cats = files.filter(f => /(^|\/)catalog\.json$/.test(f.webkitRelativePath || f.name))
    .sort((a, b) => (a.webkitRelativePath || '').split('/').length - (b.webkitRelativePath || '').split('/').length);
  if (!cats.length){ toast(t('libNoCatalog'), 6000); return; }
  const root = (cats[0].webkitRelativePath || '').replace(/catalog\.json$/, '');
  const map = new Map();
  for (const f of files){ const p = f.webkitRelativePath || f.name; if (p.startsWith(root)) map.set(p.slice(root.length), f); }
  const name = root.replace(/\/$/, '').split('/').pop() || 'library';
  await libLoad({kind:'files', files:map, name});
}
async function libOpenUrl(url){
  url = (url || '').trim(); if (!url) return;
  url = url.replace(/catalog\.json$/i, ''); if (!url.endsWith('/')) url += '/';
  let name = 'library'; try { name = decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop() || new URL(url).host); } catch(e){}
  await libLoad({kind:'url', base:url, name});
}
async function libReopen(){
  const h = await libIdb.get('dir'); if (!h) return;
  try {
    let p = await h.queryPermission({mode:'read'});
    if (p !== 'granted') p = await h.requestPermission({mode:'read'});
    if (p !== 'granted'){ toast(t('libPermDenied')); return; }
    await libLoad({kind:'dir', handle:h, name:h.name});
  } catch(e){ console.error(e); toast(t('libLoadFail', {m:e.message})); }
}

async function libDecode(item){
  if (libCache.has(item.id)) return libCache.get(item.id);
  ensureCtx();
  const buf = await ctx.decodeAudioData(await libReadSound(item));
  libCache.set(item.id, buf); return buf;
}
function stopLibPreview(){
  if (libPrev){ try { libPrev.src.onended = null; libPrev.src.stop(); } catch(e){} libPrev = null; }
  document.querySelectorAll('#libList .play.on').forEach(b => { b.classList.remove('on'); b.textContent = '▶'; });
}
async function libPreview(item, b){
  const same = libPrev && libPrev.id === item.id;
  stopLibPreview(); if (same) return;
  if (typeof stopPlayback === 'function'){ stopPlayback(true); stopShots(); }
  let buf; try { buf = await libDecode(item); } catch(e){ console.error(e); toast(t('libDecodeFail', {n:item.file})); return; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(monOut());
  src.onended = () => { if (libPrev && libPrev.src === src) stopLibPreview(); };
  libPrev = {src, id:item.id};
  if (b){ b.classList.add('on'); b.textContent = '■'; }
  src.start();
}
async function libImport(item){
  stopLibPreview();
  let buf; try { buf = await libDecode(item); } catch(e){ console.error(e); toast(t('libDecodeFail', {n:item.file})); return; }
  const s = defaultSettings(); s.trim.end = buf.duration;
  const sg = item.suggest || {};
  if (['bgm', 'sfx', 'ui', 'ambience', 'voice'].includes(sg.category)) s.category = sg.category;
  for (const k of ['pitchRandom', 'volumeRandom', 'maxInstances', 'cooldownMs']) if (typeof sg[k] === 'number') s.rules[k] = sg[k];
  if (item.loop){ s.loop = {enabled:true, start:0, end:buf.duration}; s.rules.maxInstances = 1; }
  s.note = libTxt(item.title) || item.id;
  const sd = {id:uniqueId(libToId(item.id)), sourceName:item.file.split('/').pop(), buffer:buf, duration:buf.duration,
              peaks:buildPeaks(buf), settings:s, lib:{id:item.id, file:item.file}};
  sounds.push(sd); setDirty(true); renderList(); selectSound(sd);
  toast(t('libAdded', {id:sd.id}), 3500);
}
async function libAutoAttach(){
  if (!lib) return;
  const need = sounds.filter(x => !x.buffer && x.lib && x.lib.id); if (!need.length) return;
  let n = 0;

function recipeFromText(txt){
  let s = String(txt || '').replace(/^﻿/, '');
  const blocks = [...s.matchAll(/```[a-zA-Z]*\s*([\s\S]*?)```/g)].map(m => m[1]).filter(b => /[{[]/.test(b));

  const tryP = x => { try { return JSON.parse(x); } catch(e){ return undefined; } };
  let o = tryP(s);
  if (o === undefined) o = tryP(s.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:"'])\/\/[^\n]*/g, '$1').replace(/,\s*([}\]])/g, '$1'));

}

      const f = aiFindLib(want);
      if (!f){ fixes.push(t('fxLibDrop', {a:want || '?'})); return; }
      if (!f.exact) fixes.push(t('fxLibSwap', {a:want, b:f.item.id}));
      for (const k in L) if (!['from', 'id', 'sound', 'lib', 'gainDb', 'offsetMs', 'pitch', 'cut', 'on', 'name', 'note'].includes(k)) fixes.push(t('fxUnknown', {k:'layers.' + k}));
      const y = {item:f.item, gainDb:0, offsetMs:0, pitch:1, on:L.on !== false, cut:null};
      for (const k in AI_LAY) if (L[k] != null) y[k] = clampN(k, L[k], AI_LAY[k], y[k]);
      if (L.cut != null){
        const c = Array.isArray(L.cut) ? L.cut : typeof L.cut === 'object' ? [L.cut.a ?? L.cut.start, L.cut.b ?? L.cut.end] : null;
        const D = +f.item.duration || 0, a = c ? num(c[0]) : NaN, b = c ? num(c[1]) : NaN;

      const R = AI_FX[k]; if (!R){ fixes.push(t('fxUnknown', {k:'effects.' + k})); continue; }

async function aiHeadroom(sd, n){
  const s = sd.settings, did = {lay:0, mk:0, eq:false};
  for (let k = 0; k < 10; k++){

    if (pk <= AI_PEAK * 1.001) break;
    const d = Math.max(0.5, toDb(pk) + 1.05);
    if (s.comp.enabled && s.comp.makeup > 0){ const m = Math.min(s.comp.makeup, d); s.comp.makeup = r4(s.comp.makeup - m); did.mk += m; continue; }
    const Ls = layersFor(sd), room = Ls.some(y => y.L.gainDb > AI_LAY.gainDb[0] + 0.01);

    break;

}
