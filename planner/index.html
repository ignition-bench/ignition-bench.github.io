<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>청사진 판 기획 도구</title>
<style>
:root{
  --bench0:#110f0d; --bench1:#1a1714; --bench-line:#3b332d; --bench-tx:#efe7df; --bench-dim:#a89a8d;
  --chrome0:#0c1522; --chrome1:#122033; --chrome2:#1a2c44; --chrome-line:#2a4060;
  --bp:#0d2541; --bp-grid:rgba(160,200,255,.06); --bp-grid2:rgba(160,200,255,.12);
  --ink:#e9f1ff; --ink-dim:#8fb0d6; --ink-faint:#5d7fa6; --wire:#a8c5ea; --card:#11304f; --card2:#163a5f;
  --ember:#ff7a2f; --ember-hi:#ffb35c; --ember-bg:rgba(255,122,47,.16); --ember-glow:rgba(255,122,47,.45);
  --ok:#5fd39a; --del:#ff6b6b; --del-bg:rgba(255,107,107,.14); --memo:#f3cf6b; --memo-bg:#3a3420;
  --f-ui:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
body{background:var(--bench0); color:var(--ink); font-family:var(--f-ui); font-size:14px; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0}
button:focus-visible{outline:2px solid var(--ember-hi); outline-offset:2px}
svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; pointer-events:none}
[hidden]{display:none!important}

.app{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bp); overflow:hidden; user-select:none; -webkit-user-select:none}
body.wide{background:radial-gradient(1000px 420px at 50% 115%, rgba(255,122,47,.13), transparent 60%), var(--bench0)}
body.wide .app{left:50%; right:auto; width:430px; margin-left:-215px; top:44px; bottom:16px; border-radius:26px; border:1px solid var(--chrome-line); box-shadow:0 24px 60px rgba(0,0,0,.55)}
.pcbar{position:fixed; left:16px; right:16px; top:0; height:44px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:12.5px; color:var(--bench-dim); text-align:center}
.pcbar b{color:var(--bench-tx); font-weight:600}

.top{flex:none; display:flex; align-items:center; gap:8px; min-height:58px; padding:calc(6px + env(safe-area-inset-top,0px)) max(10px, env(safe-area-inset-right,0px)) 6px max(10px, env(safe-area-inset-left,0px)); background:linear-gradient(180deg,var(--chrome1),var(--chrome0)); border-bottom:1px solid var(--chrome-line); position:relative; z-index:5}
.ib-home{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:#0d2541;border:1px solid #a8c5ea66;text-decoration:none;box-sizing:border-box}.ib-home:hover,.ib-home:focus-visible{border-color:#ff7a2f;box-shadow:0 0 0 2px #ff7a2f44}.ib-home[hidden]{display:none}
.doc{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.sub{display:flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:10px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; white-space:nowrap}
.sub button{font-family:var(--f-ui); font-size:10.5px; letter-spacing:0; text-transform:none; color:var(--ink-dim); border:1px solid var(--chrome-line); border-radius:6px; padding:1px 6px; line-height:1.4}
.doc .name{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; color:var(--ink)}
.mode{display:inline-flex; padding:3px; gap:2px; border-radius:11px; background:var(--chrome0); border:1px solid var(--chrome-line); flex:none}
.mode button{display:flex; align-items:center; gap:4px; padding:6px 9px; min-height:32px; border-radius:8px; font-size:12px; color:var(--ink-faint)}
.mode button svg.i{width:15px; height:15px}
.mode button.on{background:var(--chrome2); color:var(--ink)}
.mode button.on.edit{background:var(--ember-bg); color:var(--ember-hi); box-shadow:0 0 0 1px rgba(255,122,47,.45) inset}
.ib{width:38px; height:38px; flex:none; border-radius:11px; border:1px solid var(--chrome-line); background:var(--chrome1); color:var(--ink-dim); display:flex; align-items:center; justify-content:center}
.ib svg.i{width:19px; height:19px}

.stage{flex:1; position:relative; min-height:0; overflow:hidden; touch-action:none; cursor:default}
.stage > svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.chip{position:absolute; left:50%; top:12px; transform:translateX(-50%); max-width:calc(100% - 24px); display:flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:7; pointer-events:none;
  background:rgba(12,21,34,.92); border:1px solid var(--chrome-line); color:var(--ink-dim); transition:opacity .25s}
.chip.ember{border-color:rgba(255,122,47,.55); color:var(--ember-hi)}
.chip.ok{border-color:rgba(95,211,154,.55); color:var(--ok)}
.chip.off{opacity:0}
.zoom{position:absolute; right:10px; bottom:10px; display:flex; align-items:center; gap:5px; height:34px; font-family:var(--f-mono); font-size:11.5px; color:var(--ink-dim); background:rgba(12,21,34,.82); border:1px solid var(--chrome-line); border-radius:9px; padding:0 10px; z-index:6}
.empty{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); width:min(280px, calc(100% - 40px)); text-align:center; color:var(--ink-faint); font-size:13px; line-height:1.7; pointer-events:none; border:1.5px dashed var(--chrome-line); border-radius:16px; padding:18px 14px}
.empty b{color:var(--ink-dim)}
.zoom svg.i{width:15px; height:15px}
.logo{width:40px; height:40px; flex:none; border-radius:12px; border:1px solid var(--chrome-line); background:var(--chrome1); display:flex; align-items:center; justify-content:center; position:relative; padding:0}
.logo svg{width:30px; height:30px}
.ib.newf{color:var(--ember-hi); border-color:rgba(255,122,47,.45)}
.top{gap:6px}
.top .ib,.top .logo{width:36px; height:36px} .top .logo svg{width:28px; height:28px}
.doc .name{font-size:14px}
.mode button{padding:6px 8px}
@media (max-width: 379px){ .mode button .lab{display:none} .top .ib,.top .logo{width:34px; height:34px} }
.logo .badge{position:absolute; right:-5px; bottom:-5px; font-size:11px; line-height:1; background:var(--chrome0); border:1px solid var(--chrome-line); border-radius:999px; padding:2px 3px}
.tipb{position:fixed; z-index:30; max-width:min(300px, calc(100vw - 24px)); padding:10px 12px 10px 12px; border-radius:13px; background:#2a1a0e; border:1px solid rgba(255,122,47,.75); color:#ffe2c8; font-size:13px; line-height:1.55; box-shadow:0 12px 30px rgba(0,0,0,.5); display:flex; gap:9px; align-items:flex-start}
.tipb b{color:var(--ember-hi); font-weight:700}
.tipb button{flex:none; margin-left:auto; font-size:12px; color:var(--ember-hi); border:1px solid rgba(255,122,47,.5); border-radius:8px; padding:3px 8px}
.tipb::after{content:""; position:absolute; left:var(--ax,24px); width:12px; height:12px; background:#2a1a0e; transform:rotate(45deg)}
.tipb.below::after{top:-7px; border-left:1px solid rgba(255,122,47,.75); border-top:1px solid rgba(255,122,47,.75)}
.tipb.above::after{bottom:-7px; border-right:1px solid rgba(255,122,47,.75); border-bottom:1px solid rgba(255,122,47,.75)}
.lk .ii{display:inline-flex; width:18px; height:18px; margin-left:3px; vertical-align:-4px; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--chrome-line); font:700 10.5px var(--f-ui); color:var(--ink-dim)}
.info{position:fixed; z-index:24; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top,0px)); max-height:calc(100% - 24px); overflow:auto; border-radius:18px; padding:14px; background:#0f1d30; border:1px solid var(--chrome-line); box-shadow:0 20px 50px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:8px}
body.wide .info{left:50%; right:auto; width:410px; margin-left:-205px}
.info h4{margin:0 0 2px; font-size:15px; display:flex; align-items:center; gap:8px}
.info h4 button{margin-left:auto; width:34px; height:34px; border-radius:10px; border:1px solid var(--chrome-line); font-size:18px; color:var(--ink-dim)}
.info .it{padding:9px 11px; border-radius:12px; background:var(--chrome1); border:1px solid var(--chrome-line)}
.info .it.dev{border-style:dashed}
.info .it b{display:block; font-size:13.5px; margin-bottom:3px}
.info .it span{display:block; font-size:12.5px; color:var(--ink-dim); line-height:1.6}
.info .it code{font-family:var(--f-mono); font-size:11.5px; color:var(--memo)}
.ckl{display:flex; gap:8px; align-items:baseline; cursor:pointer; padding:2px 0; border-radius:8px}
.ckl .ck{font-size:21px; line-height:1; color:var(--ink-dim)}
.ckl.on{color:var(--ink-faint); text-decoration:line-through} .ckl.on .ck{color:var(--ok); text-decoration:none}
.ex-img{flex:none; margin:2px 14px 6px; height:110px; border-radius:10px; overflow:hidden; border:1.5px dashed rgba(168,197,234,.55); display:flex; align-items:center; justify-content:center; gap:6px; color:var(--ink-dim); font-size:12px; background:rgba(160,200,255,.05)}
.ex-img img{width:100%; height:100%; object-fit:cover; display:block}
.ex-img.has{border-style:solid; border-color:var(--chrome-line)}
.shp{display:flex; flex-direction:column; gap:6px}
.shp .cap{display:flex; align-items:center} .shp .cap .ii{margin-left:6px}
.sheet.help{height:min(86%, 720px); max-height:90%; gap:8px; overflow:hidden}
.sheet.help > h3,.sheet.help > .grab,.hsearch,.hchips{flex:none}
.hsearch{display:flex; align-items:center; gap:8px; height:46px; border-radius:12px; border:1px solid var(--chrome-line); background:var(--bp); padding:0 12px; color:var(--ink-faint)}
.hsearch input{flex:1; min-width:0; border:none; outline:none; background:none; color:var(--ink); font:16px var(--f-ui); user-select:text; -webkit-user-select:text}
.hchips{display:flex; align-items:center; gap:6px; overflow-x:auto; overflow-y:hidden; height:44px; padding:5px 2px; box-sizing:border-box; scrollbar-width:none}
.hchips::-webkit-scrollbar{display:none}
.hchips button{flex:none; height:32px; padding:0 11px; border-radius:999px; border:1px solid var(--chrome-line); background:var(--chrome1); color:var(--ink-dim); font-size:12.5px}
.hchips button.on{color:var(--ember-hi); border-color:rgba(255,122,47,.6); background:var(--ember-bg)}
.hcards{flex:1 1 auto; display:flex; flex-direction:column; gap:8px; overflow:auto; min-height:0}
.hcard{border-radius:14px; background:var(--chrome1); border:1px solid var(--chrome-line); padding:11px 13px}
.hcard summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px}
.hcard summary::-webkit-details-marker{display:none}
.hcard summary::after{content:"▾"; margin-left:auto; color:var(--ink-faint); font-weight:400}
.hcard[open] summary::after{content:"▴"}
.hcard .kw{display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 2px}
.hcard .kw b{font-size:11.5px; font-weight:700; color:var(--ink); background:var(--chrome2); border-radius:999px; padding:1px 8px}
.hcard p{margin:6px 0 0; font-size:13px; line-height:1.6; color:var(--ink-dim)}
.hcard ol{margin:8px 0 0; padding-left:20px; font-size:13px; line-height:1.65; color:var(--ink)}
.hcard ol li{margin:2px 0}
.hnone{font-size:13px; color:var(--ink-faint); text-align:center; padding:18px 0}
.mer{width:100%; height:44vh; resize:none; border-radius:12px; border:1px solid var(--chrome-line); background:var(--bp); color:var(--ink); font:12.5px/1.55 var(--f-mono); padding:10px; user-select:text; -webkit-user-select:text}
.shpb{display:grid; grid-template-columns:repeat(4,1fr); gap:5px}
.shpb button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px 5px; border-radius:10px; background:var(--chrome1); border:1px solid var(--chrome-line); color:var(--ink-dim); font-size:10.5px; line-height:1.15}
.shpb button svg{width:30px; height:21px}
.shpb button.on{color:var(--ember-hi); border-color:rgba(255,122,47,.6); background:var(--ember-bg)}
.shpb button.dev{border-style:dashed}
.sw6{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.sw6 button{width:30px; height:30px; border-radius:8px; border:1px solid rgba(255,255,255,.18)}
.sw6 button.on{box-shadow:0 0 0 2px var(--chrome0), 0 0 0 4px var(--ink)}
.sw6 button.none{background:repeating-linear-gradient(135deg, var(--card) 0 5px, var(--card2) 5px 10px)}
.seg3{display:grid; grid-template-columns:auto 1fr 1fr 1fr; gap:6px; align-items:center}
.seg3 button{height:34px; border-radius:10px; background:var(--chrome1); border:1px solid var(--chrome-line); font-size:12px; color:var(--ink-dim)}
.seg3 button.on{color:#5fd3b0; border-color:rgba(95,211,176,.6); box-shadow:0 0 12px -2px rgba(95,211,176,.55)}
.penbar{flex:1; display:flex; align-items:center; gap:10px; min-width:0}
.dots{display:flex; gap:10px}
.dots button{width:28px; height:28px; border-radius:50%; box-shadow:0 0 0 2px var(--chrome0), 0 0 0 3px transparent}
.dots button.on{box-shadow:0 0 0 2px var(--chrome0), 0 0 0 4px var(--ink)}
.penbar .ib.erase{width:auto; padding:0 10px; gap:5px; font-size:12px; white-space:nowrap}
.penbar .ib.on{color:var(--ember-hi); border-color:rgba(255,122,47,.6); background:var(--ember-bg)}
.pdone{margin-left:auto; height:42px; padding:0 16px; border-radius:12px; background:linear-gradient(180deg,var(--ember-hi),var(--ember)); color:#1a0d05; font-weight:700; flex:none}
.memo-ta{width:100%; min-height:84px; resize:none; border-radius:12px; border:1px solid rgba(243,207,107,.7); background:#2a2618; color:var(--memo); font:16px/1.6 var(--f-ui); padding:10px 12px; outline:none; user-select:text; -webkit-user-select:text}
.ex-strip .done{margin-left:4px; padding:0 12px; white-space:nowrap; flex:none; color:#1a0d05; font:700 13.5px var(--f-ui); background:linear-gradient(180deg,var(--ember-hi),var(--ember))}

.dock{flex:none; min-height:72px; display:flex; align-items:center; gap:4px; padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px)); background:linear-gradient(0deg,var(--chrome0),var(--chrome1)); border-top:1px solid var(--chrome-line); position:relative; z-index:5}
.ud{display:flex; gap:2px; padding-right:6px; margin-right:2px; border-right:1px solid var(--chrome-line)}
.ud button{width:42px; height:46px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:var(--ink-dim)}
.ud button:disabled{opacity:.35}
.tools{flex:1; display:flex; justify-content:space-around}
.tool{display:flex; flex-direction:column; align-items:center; gap:4px; width:58px; padding:7px 0 6px; border-radius:13px; color:var(--ink-dim); font-size:10.5px}
.tool.on{color:var(--ember-hi); background:var(--ember-bg); box-shadow:0 0 0 1px rgba(255,122,47,.45) inset, 0 0 18px -4px var(--ember-glow)}
.tool.later{opacity:.45}
.big-edit{flex:1; height:50px; margin:0 6px; border-radius:15px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:15px; color:#1a0d05;
  background:linear-gradient(180deg,var(--ember-hi),var(--ember)); box-shadow:0 6px 20px -6px var(--ember-glow), 0 0 0 1px rgba(255,255,255,.12) inset}
.big-edit svg.i{width:19px; height:19px}

.scrim{position:fixed; inset:0; z-index:20; background:rgba(4,10,18,.5)}
.scrim.soft{background:rgba(4,10,18,.38)}
.expand{position:fixed; z-index:21; display:flex; flex-direction:column; border-radius:18px; overflow:hidden; background:var(--card); border:2px solid var(--ember); box-shadow:0 0 0 6px rgba(255,122,47,.12), 0 24px 50px rgba(0,0,0,.55)}
.expand.ro{border-color:var(--wire); box-shadow:0 0 0 6px rgba(168,197,234,.08), 0 24px 50px rgba(0,0,0,.55)}
.ex-head{flex:none; display:flex; align-items:center; gap:8px; padding:12px 14px 4px}
.ex-head i{width:4px; height:20px; border-radius:2px; background:var(--wire); flex:none}
.ex-head small{margin-left:auto; flex:none; font-family:var(--f-mono); font-size:10px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase}
.ex-title{flex:1; min-width:0; font:700 18px/1.3 var(--f-ui); color:var(--ink); background:none; border:none; outline:none; padding:4px 0; user-select:text; -webkit-user-select:text}
.ex-title::placeholder,.ex-body::placeholder{color:var(--ink-faint); font-weight:400}
.ex-body{flex:1; min-height:0; width:100%; resize:none; border:none; outline:none; background:none; color:var(--ink); font:16px/1.8 var(--f-ui); padding:6px 16px 10px; user-select:text; -webkit-user-select:text}
.ex-read{flex:1; min-height:0; overflow:auto; padding:6px 16px 14px; font-size:16px; line-height:1.8; white-space:pre-wrap; word-break:break-word; user-select:text; -webkit-user-select:text}
.ex-strip{flex:none; display:flex; align-items:center; gap:2px; padding:7px 8px; border-top:1px solid var(--chrome-line); background:var(--chrome0)}
.ex-strip button{height:38px; min-width:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font:700 13px var(--f-mono)}
.ex-strip button:disabled{opacity:.35}
.ex-strip .sep{flex:1}
.ex-strip button.plusimg{position:relative}
.ex-strip button.plusimg::after{content:"+"; position:absolute; right:4px; top:2px; font-size:12px; color:var(--ember-hi); font-family:var(--f-ui)}

.pop{position:fixed; z-index:21; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); border-radius:18px; padding:12px; display:flex; flex-direction:column; gap:10px; background:rgba(14,26,42,.98); border:1px solid var(--chrome-line); box-shadow:0 16px 40px rgba(0,0,0,.55)}
body.wide .pop,body.wide .sheet{left:50%; right:auto; width:410px; margin-left:-205px}
.cap{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.acts{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.acts button{display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 7px; border-radius:12px; background:var(--chrome1); font-size:10.5px; color:var(--ink-dim)}
.acts button svg.i{color:var(--ink)}
.acts button.later{opacity:.4}
.acts button.del{background:var(--del-bg); color:var(--del)} .acts button.del svg.i{color:var(--del)}
.sheet{position:fixed; z-index:21; left:0; right:0; bottom:0; max-height:86%; overflow:auto; background:linear-gradient(180deg,var(--chrome1),var(--chrome0)); border-top:1px solid var(--chrome-line); border-radius:22px 22px 0 0; padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.grab{width:42px; height:5px; border-radius:3px; background:var(--chrome-line); margin:0 auto 4px; flex:none}
.sheet h3{margin:0; font-size:15px; display:flex; align-items:center; gap:8px}
.verdict{display:flex; align-items:center; gap:12px; padding:12px; border-radius:14px; background:var(--ember-bg); border:1px solid rgba(255,122,47,.5)}
.verdict b{font-size:17px; color:var(--ember-hi)}
.verdict span{font-size:12.5px; color:var(--ink-dim)}
.readings{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; padding:4px 2px}
.readings dt{color:var(--ink-faint)} .readings dd{margin:0; color:var(--ink); font-family:var(--f-mono); font-size:12px}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.seg button{min-height:40px; border-radius:11px; background:var(--chrome1); border:1px solid var(--chrome-line); font-size:12.5px; color:var(--ink-dim); padding:4px}
.seg button.on{color:var(--ember-hi); border-color:rgba(255,122,47,.6); background:var(--ember-bg)}
.note{font-size:12px; color:var(--ink-faint); line-height:1.6; margin:0}
.wide-btn{min-height:44px; border-radius:12px; border:1px solid var(--chrome-line); background:var(--chrome1); color:var(--ink-dim); font-size:13px}
.wide-btn.warn{border-color:rgba(255,107,107,.5); color:var(--del); background:var(--del-bg)}
.wide-btn.go{border:none; color:#1a0d05; font-weight:700; background:linear-gradient(180deg,var(--ember-hi),var(--ember))}
.pop.line{gap:9px}
.lrow{display:flex; align-items:flex-start; gap:8px}

.v3card{width:min(440px, 92%); padding:16px 18px; border-radius:14px; background:linear-gradient(180deg,var(--chrome1),var(--chrome0)); border:1px solid var(--chrome-line); box-shadow:0 20px 50px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:10px}
.v3card h3{margin:0; font-size:16px} .v3card p{margin:0; font-size:12.5px; color:var(--ink-dim)}
.v3card ul{margin:0; padding-left:18px; font-size:13px; color:var(--ink-dim); display:flex; flex-direction:column; gap:4px} .v3card li.on{color:var(--ember-hi)}
.v3q{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-faint)}
.v3q button{min-height:32px; padding:0 10px; border-radius:9px; border:1px solid var(--chrome-line); background:var(--chrome1); color:var(--ink-dim); font-size:12.5px}
.v3q button.on{color:var(--ember-hi); border-color:rgba(255,122,47,.6); background:var(--ember-bg)}
.v3btns{display:grid; grid-template-columns:1fr 1fr; gap:8px} .v3btns .ib2:only-child{grid-column:1/-1}
.v3bar{height:10px; border-radius:6px; background:var(--chrome0); border:1px solid var(--chrome-line); overflow:hidden} .v3bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--ember),var(--ember-hi))}
.pvwrap.v3 .pvhead{flex-wrap:wrap}
.v3seg{display:inline-flex; padding:3px; gap:2px; border-radius:10px; background:var(--chrome0); border:1px solid var(--chrome-line)}
.v3seg button{padding:5px 11px; border-radius:7px; color:var(--ink-faint); font-size:12.5px}
.v3seg button.on{background:var(--ember-bg); color:var(--ember-hi); box-shadow:0 0 0 1px rgba(255,122,47,.45) inset}
select.v3ang{appearance:auto; -webkit-appearance:auto; min-height:32px}
.v3body{flex:1; min-height:0; position:relative; background:#08111c; overflow:hidden}
.v3stage{position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; overflow:hidden; border-radius:6px; background:radial-gradient(900px 500px at 50% 30%, #123459, #0b1f37 70%)}
.v3view{position:absolute; inset:0} .v3view svg{display:block}
#v3A .v3f,#v3A [id^="v3T"],#v3A [id^="v3LT"],#v3A #v3LG{pointer-events:none}
.v3logo{position:absolute; left:1193px; top:10px; width:72px; height:74px; opacity:0; transition:opacity .8s ease; pointer-events:none; z-index:4} .v3logo.on{opacity:.95} .v3logo svg{width:72px; height:74px; display:block}
.v3cap{position:absolute; left:14px; top:12px; font-size:13px; color:var(--ink-faint); pointer-events:none} .v3cap b{color:var(--ink-dim)}
.v3help{position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--ink-faint); pointer-events:none}
.v3tip{position:absolute; z-index:5; pointer-events:none; width:270px; padding:10px 12px; border-radius:10px; background:rgba(9,22,40,.96); border:1px solid var(--wire); box-shadow:0 12px 30px rgba(0,0,0,.5); font-size:13.5px; line-height:1.55}
.v3tip b{display:block; font-size:15px; margin-bottom:4px} .v3tip div{color:#cfe0f7; white-space:pre-wrap; margin-bottom:6px}
.v3tip p{margin:5px 0 0; padding:5px 8px; border-radius:4px; background:#3a3420; color:var(--memo); white-space:pre-wrap; font-size:13.5px}
.v3tip p.mr{background:#3a2321; color:#ff8f80} .v3tip p.mg{background:#1d3a2b; color:#6fdba3} .v3tip p.mb{background:#1b2f48; color:#86c8ff}
.v3tip p small{display:block; font-size:11px; opacity:.75}
.v3toast{position:absolute; left:50%; bottom:46px; transform:translate(-50%, 8px); min-width:260px; max-width:760px; padding:13px 22px; border-radius:12px; background:rgba(9,22,40,.97); border:1.5px solid var(--ember); color:var(--ember-hi); font-size:18px; font-weight:700; text-align:center; box-shadow:0 14px 34px rgba(0,0,0,.55); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:6}
.v3toast.on{opacity:1; transform:translate(-50%, 0)}
.v3toast.ok{border-color:rgba(95,211,154,.75); color:var(--ok)}
.v3toast small{display:block; margin-top:5px; font-size:13.5px; font-weight:400; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.shead{display:flex; align-items:center; gap:8px; position:sticky; top:-10px; z-index:3; margin:-10px -16px 0; padding:10px 16px 8px; background:var(--chrome1); border-bottom:1px solid transparent} .shead h3{flex:1; min-width:0}
.shead .smp{height:32px; padding:0 11px; border-radius:9px; border:1px solid var(--chrome-line); background:var(--chrome1); color:var(--ink-dim); font-size:12.5px; white-space:nowrap}
.shead .smp:hover{color:var(--ink); border-color:var(--wire)}
.shead .sx{width:32px; height:32px; border-radius:9px; border:1px solid var(--chrome-line); background:var(--chrome1); color:var(--ink-dim); font-size:16px; flex:none}
.shead .sx:hover{color:var(--ink); border-color:var(--wire)}
.insp .hchips{flex-wrap:wrap; height:auto; overflow:visible; padding:2px 0}

.crumb button.back{border-color:rgba(255,122,47,.8); color:var(--ember-hi); background:var(--ember-bg)}
.crumb button.back:hover{border-color:var(--ember)}
.cfold svg.i{width:16px; height:16px}
.act4{display:grid; grid-template-columns:1fr 1fr; gap:5px}
.ifld.sel{appearance:auto; -webkit-appearance:auto; padding:7px 8px}
.fnav{display:flex; flex-direction:column; gap:4px}
.pvwrap{position:fixed; z-index:24; inset:24px; display:flex; flex-direction:column; border-radius:16px; overflow:hidden; border:1px solid var(--chrome-line); background:var(--bench0); box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pvhead{flex:none; display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; background:linear-gradient(180deg,var(--chrome1),var(--chrome0)); border-bottom:1px solid var(--chrome-line); font-size:13px}
.pvhead b{color:var(--ember-hi)} .pvhead span{color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pvhead .grow{flex:1}
.pvwrap iframe{flex:1; border:none; width:100%; background:var(--bench0)}

.fvnotes{margin:4px 0 8px; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}

.fvnotes li small{display:block; color:var(--ink-faint); font-size:11px}

var RE_NUM = /^(\d+)\.\s/, RE_BUL = /^([•\-])\s/, RE_CHK = /^([☐☑])\s/;
function lineBounds(v, pos){ var s = v.lastIndexOf("\n", pos - 1) + 1, e = v.indexOf("\n", pos); if (e < 0) e = v.length; return {s:s, e:e}; }
function setVal(ta, v, caret){ ta.value = v; ta.setSelectionRange(caret, caret); }
function listEnter(ta){
  var v = ta.value, p = ta.selectionStart, q = ta.selectionEnd, lb = lineBounds(v, p), line = v.slice(lb.s, lb.e), m;
  if ((m = RE_NUM.exec(line)) || (m = RE_BUL.exec(line)) || (m = RE_CHK.exec(line))){
    if (!line.slice(m[0].length).trim()){ setVal(ta, v.slice(0, lb.s) + v.slice(lb.s + m[0].length), lb.s); return; }
    var pre = RE_NUM.test(line) ? (parseInt(m[1], 10) + 1) + ". " : RE_CHK.test(line) ? "☐ " : m[1] + " ";
    setVal(ta, v.slice(0, p) + "\n" + pre + v.slice(q), p + 1 + pre.length); return;
  }

}
function listToggle(ta, kind){

    var v0 = ta.value, p0 = ta.selectionStart, b0 = lineBounds(v0, p0), l0 = v0.slice(b0.s, b0.e), c = RE_CHK.exec(l0), o = RE_NUM.exec(l0) || RE_BUL.exec(l0), nl0;
    if (c) nl0 = (c[1] === "☐" ? "☑ " : "☐ ") + l0.slice(c[0].length);
    else nl0 = "☐ " + (o ? l0.slice(o[0].length) : l0);
    setVal(ta, v0.slice(0, b0.s) + nl0 + v0.slice(b0.e), Math.min(b0.s + nl0.length, Math.max(b0.s + 2, p0 + (nl0.length - l0.length))));
    return;
  }
  var v = ta.value, p = ta.selectionStart, lb = lineBounds(v, p), line = v.slice(lb.s, lb.e), m = RE_NUM.exec(line) || RE_BUL.exec(line) || RE_CHK.exec(line);

  if (!(m && ((kind === "num") === isNum))){
    if (kind === "num"){
      var prev = lb.s > 0 ? v.slice(lineBounds(v, lb.s - 1).s, lb.s - 1) : "", pm = RE_NUM.exec(prev);

}

  "바탕에서 M (또는 바깥 빈 곳 오른쪽 클릭 「여기에 메모」) = 설명선 없는 혼자 메모 → 끌어서 붙여요|M on empty space (or right-click outside → “Memo here”) = a free memo → drag it to attach;컨트롤 가까이 끌면 「뿅」 그 컨트롤에 · 폼 빈 곳에 놓으면 화면 전체 · 바깥에 두면 혼자 그대로|Near a control it snaps to it · on empty form space = whole screen · leave it outside to keep it free;컨트롤 선택 + M · 오른쪽 클릭 「메모 붙이기」 = 그 컨트롤에 바로|Select a control + M or right-click “Add a memo” = attached right away;「✂ 설명선 삭제」 = 선만 떼어 두기 (다시 끌어 붙이거나 🗑)|“✂ Remove callout line” keeps the memo, just unhooked (drag it back or 🗑);설명선이 컨트롤을 가리키고, 메모는 폼 테두리 바깥에 붙어 폼을 안 가려요|The callout points at the control and the memo sits outside the form;폼 빈 곳에 놓으면 화면 전체에 붙는 메모|Drop it on empty form space for a whole-screen memo;도면에서는 화면 상자에 「🗒 숫자」만 보여요|On the plan, the screen shows just “🗒 n”","pc"],
