<head>
<meta charset="utf-8">

<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100dvh}
  [hidden]{display:none!important}
  .gbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));flex:none}
  .gbar .home{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:9px;background:var(--bp);border:1px solid #a8c5ea66;text-decoration:none}
  .gbar .home:hover,.gbar .home:focus-visible{border-color:var(--ember);box-shadow:0 0 0 2px var(--ember-bg)}
  .gbar .tt{min-width:0;flex:1}
  .gbar h1{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gbar .sheet{font:600 10.5px var(--f-mono);letter-spacing:.16em;color:var(--wire);opacity:.8}
  .gbar .btn{display:inline-flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 12px;border-radius:9px;border:1px solid #a8c5ea55;background:#0d254199;color:var(--ink);font-size:13px;text-decoration:none;white-space:nowrap}
  .gbar .btn:hover,.gbar .btn:focus-visible{border-color:var(--ember);color:#fff}
  .gbar .lang{flex:none}
  .stage{flex:1;display:flex;min-height:0;padding:0 14px 10px;overflow:auto;--s:1}
  .stage:fullscreen{background:#000;padding:0;overflow:hidden}
  .fit{position:relative;flex:none;margin:auto;width:calc(1280px * var(--s));height:calc(740px * var(--s))}
  .frame{position:absolute;left:0;top:0;width:1280px;height:740px;transform:scale(var(--s));transform-origin:0 0;border:1px solid var(--wire);border-radius:10px;overflow:hidden;background:#120b06;box-shadow:0 0 0 4px #0d254188,0 0 28px var(--ember-bg)}
  .stage:fullscreen .frame{border:0;border-radius:0;box-shadow:none}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .touch{flex:1;display:grid;place-items:center;padding:8px 0}
  .tcard{max-width:440px;text-align:center;background:var(--bp2);border:1.5px solid color-mix(in srgb,var(--wire) 70%,transparent);border-radius:10px;padding:26px 22px 22px}
  .tcard .ti{font-size:34px;line-height:1}
  .tcard .tm{margin:12px 0 16px;font-size:15.5px;line-height:1.7}
  .tcard .tgo{display:inline-block;background:var(--ember);color:#1b0d04;font-weight:700;font-size:14px;text-decoration:none;border-radius:9px;padding:9px 16px}
  .tcard .tgo:hover,.tcard .tgo:focus-visible{background:var(--ember-hi)}
  .tcard .tf{margin:16px 0 0;font-size:13px;color:var(--ink-dim);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .tcard .tf button{background:transparent;border:1px solid var(--ember);color:var(--ember-hi);border-radius:999px;padding:4px 12px;font-size:13px}
  .tcard .tf button:hover,.tcard .tf button:focus-visible{background:var(--ember-bg)}
  .gfoot{flex:none;text-align:center;color:var(--ink-faint);font-size:12px;padding:0 14px calc(10px + env(safe-area-inset-bottom))}
  .gfoot a{color:var(--ink-dim)}
  @media (max-width:560px){
    .gbar{gap:8px;padding-left:10px;padding-right:10px}
    .gbar .sheet{display:none}
    .gbar .btn .l{display:none}
    .gbar .btn{padding:0 10px}
    .stage{padding:0 6px 6px}
  }
</style>
</head>
<body>
  <header class="gbar">
    <a class="home" href="../../" data-ko-title="The Ignition Bench 메인으로" data-en-title="Back to The Ignition Bench" title="The Ignition Bench 메인으로"><svg viewBox="28 12 30 40" width="18" height="18" aria-hidden="true"><path d="M41 49 C 29 45, 31 32, 36 25 C 37 31, 40 32, 41 30 C 42 24, 41 18, 46 14 C 48 24, 54 29, 52 39 C 51 45, 47 49, 41 49Z" fill="#ff7a2f"/></svg></a>
    <div class="tt">
      <div class="sheet">SHEET 03 · GAMES</div>
      <h1 data-ko="⚑ Tiny Mighty Mob · 깃발 전쟁" data-en="⚑ Tiny Mighty Mob">⚑ Tiny Mighty Mob · 깃발 전쟁</h1>
    </div>
    <button type="button" class="btn" id="fs" hidden data-ko-title="전체 화면" data-en-title="Fullscreen" title="전체 화면">⛶ <span class="l" data-ko="전체 화면" data-en="Fullscreen">전체 화면</span></button>
    <a class="btn" href="https://game-of-dev.itch.io/tiny-mighty-mob" target="_blank" rel="noopener" data-ko-title="itch.io 페이지에서 보기 (평점 · 댓글)" data-en-title="View on itch.io (ratings · comments)" title="itch.io 페이지에서 보기 (평점 · 댓글)">itch.io <span class="l">↗</span></a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="ko" aria-pressed="true">KO</button><button type="button" data-l="en" aria-pressed="false">EN</button></div>
  </header>

  <main class="stage" id="stage">
    <div class="fit" id="fit" hidden>
      <div class="frame" id="frame">
        <iframe id="game" data-src="https://itch.io/embed-upload/20789965?color=120b06" title="Tiny Mighty Mob" allow="fullscreen; autoplay" allowfullscreen width="1280" height="740"><a href="https://game-of-dev.itch.io/tiny-mighty-mob">Play Tiny Mighty Mob on itch.io</a></iframe>
      </div>
    </div>

    <section class="touch" id="touch" hidden>
      <div class="tcard">
        <div class="ti" aria-hidden="true">🖥</div>
        <p class="tm" data-ko="이 게임은 PC를 권장해요. 태블릿은 마우스(또는 트랙패드)와 키보드를 연결해야 플레이할 수 있어요." data-en="This game is best played on a PC. On a tablet, you need a mouse (or trackpad) and a keyboard connected.">이 게임은 PC를 권장해요. 태블릿은 마우스(또는 트랙패드)와 키보드를 연결해야 플레이할 수 있어요.</p>
        <a class="tgo" href="https://game-of-dev.itch.io/tiny-mighty-mob" target="_blank" rel="noopener" data-ko="itch.io에서 보기 ↗" data-en="View on itch.io ↗">itch.io에서 보기 ↗</a>
        <p class="tf"><span data-ko="마우스·트랙패드와 키보드를 연결했다면" data-en="Mouse or trackpad and keyboard connected?">마우스·트랙패드와 키보드를 연결했다면</span><button type="button" id="openAnyway" data-ko="그래도 열어 보기" data-en="Open anyway">그래도 열어 보기</button></p>
      </div>
    </section>
    <noscript><p style="margin:auto"><a href="https://game-of-dev.itch.io/tiny-mighty-mob">Play Tiny Mighty Mob on itch.io</a></p></noscript>
  </main>

  <p class="gfoot"><span data-ko="PC용 개발 데모(v0.15.5) · 게임은 itch.io에서 불러와요 · 평점 · 댓글은 " data-en="PC demo build (v0.15.5) · The game loads from itch.io · ratings and comments on ">PC용 개발 데모(v0.15.5) · 게임은 itch.io에서 불러와요 · 평점 · 댓글은 </span><a href="https://game-of-dev.itch.io/tiny-mighty-mob" target="_blank" rel="noopener">itch.io</a></p>

<script>
(() => {
  const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
  let lang = LS.get('ib-lang') || ((navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en');
  const render = () => {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
    document.querySelectorAll('[data-ko-title]').forEach(el => { el.title = el.dataset[lang + 'Title']; el.setAttribute('aria-label', el.title); });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
  };
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; LS.set('ib-lang', lang); render(); }));
  render();

  const stage = document.getElementById('stage'), fit = document.getElementById('fit'), game = document.getElementById('game');
  const touch = document.getElementById('touch'), fs = document.getElementById('fs');
  const W = 1280, H = 740, MIN = 0.5;

  const resize = () => {
    if (fit.hidden) return;
    const full = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const cs = getComputedStyle(stage);
    const aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let s = Math.min(aw / W, ah / H);
    s = full ? s : Math.min(1, Math.max(MIN, s));
    stage.style.setProperty('--s', String(Math.max(0.1, s)));
  };

  const showGame = () => {
    touch.hidden = true; fit.hidden = false;
    if (!game.src) game.src = game.dataset.src;
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    fs.hidden = !req;
    resize();
  };

  if (matchMedia('(pointer: coarse)').matches) touch.hidden = false; else showGame();
  document.getElementById('openAnyway').addEventListener('click', showGame);

  fs.addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
  });
  addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', resize);
  document.addEventListener('webkitfullscreenchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
})();
</script>
</body>
</html>
