<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<div id="app">

  <div id="start-screen">

    <div class="start-box">
      <h1>Director's Desk</h1>
      <div class="start-sub" data-i18n="startSub"></div>
      <div id="pc-only" class="pc-only" hidden><b data-i18n="pcOnlyT"></b><span data-i18n="pcOnlyS"></span></div>
      <div class="start-menu">
        <button id="menu-actor" class="menu-item"><b data-i18n="menuActor"></b><span data-i18n="menuActorSub"></span></button>
        <button id="menu-set" class="menu-item"><b data-i18n="menuSet"></b><span data-i18n="menuSetSub"></span></button>
        <button id="menu-edit" class="menu-item"><b data-i18n="menuEdit"></b><span data-i18n="menuEditSub"></span></button>

          <button id="lv-beginner" class="lv-btn" data-i18n="lvBeginner"></button><button id="lv-expert" class="lv-btn" data-i18n="lvExpert"></button></div>
        <div id="level-desc"></div>

        <div id="recent-list"></div>
        <div id="recent-none" data-i18n="recentNone"></div>
      </div>
    </div>
  </div>

    <div id="actor-top">

      <button id="pose-open" class="c-get" data-i18n="poseOpen"></button>
      <select id="pose-preset" class="c-get"></select>
      <button id="free-range" class="c-edit" data-i18n-title="freeTitle"></button>

      <button id="photo-sample" class="c-get" data-i18n="photoSample" data-i18n-title="photoSampleTitle"></button>
      <button id="pose-undo" data-i18n-title="undoTitle">↶</button>
      <button id="pose-redo" data-i18n-title="redoTitle">↷</button>
      <input id="photo-input" type="file" accept="image/*" hidden>
    </div>
    <div id="photo-bar" hidden>
      <span id="photo-tip" data-i18n-html="photoTip"></span>
      <label data-i18n="photoOpacity"></label>
      <input id="photo-op" type="range" min="10" max="100" step="5" value="55" data-i18n-title="photoOpacity">
      <button id="photo-close" class="c-del" data-i18n="photoClose"></button>
    </div>
    <div id="rig-step" hidden></div>
    <div id="actor-top-right">

      <button id="view-top" class="c-view" data-i18n="viewTop" data-i18n-title="viewTopTitle"></button>
      <button id="actor-reset-view" class="c-view" data-i18n="resetView"></button>
    </div>
    <div id="joint-panel"></div>
    <div id="actor-hint" data-i18n="actorHint"></div>
    <div id="actor-toast" class="toast-a"></div>
    <div id="actor-hover" hidden></div>
    <input type="file" id="pose-input" accept="application/json" hidden>
    <div id="motion-bar" class="empty">
      <div class="mot-row">
        <span class="mot-grp g-get"><button id="mot-lib" class="mot-lib c-get" data-i18n-title="motLibTitle"><span data-i18n="motLib"></span></button><button id="mot-pack" class="c-get" data-i18n-title="motPackTitle"><span data-i18n="motPack"></span> <b id="mot-pack-n"></b></button></span>
        <span class="mot-grp g-play"><button id="mot-start" class="c-edit" data-i18n-title="motStart">⏮</button><button id="mot-play" class="mot-play c-edit" data-i18n-title="motPlay">▶ (Space)</button><button id="mot-end" class="c-edit" data-i18n-title="motEnd">⏭</button><button id="mot-loop" class="c-edit" data-i18n="motLoop" data-i18n-title="motLoopTitle"></button><select id="mot-speed" class="c-edit" data-i18n-title="motSpeedTitle"><option value="0.25">×0.25</option><option value="0.5">×0.5</option><option value="1" selected>×1</option><option value="1.5">×1.5</option><option value="2">×2</option></select><div id="mot-time">0.00s / 2.00s</div></span>
        <span class="mot-grp g-make"><button id="mot-add" class="mot-add c-make" data-i18n-title="motAddTitle"></button><button id="mot-dup" class="c-make" data-i18n="motDup" data-i18n-title="motDupTitle"></button></span>
        <span class="mot-grp g-edit"><select id="mot-ease" class="c-edit" data-i18n-title="motEaseTitle"></select><button id="mot-onion" class="c-edit" data-i18n="motOnion" data-i18n-title="motOnionTitle"></button><button id="mot-mirror" class="c-edit" data-i18n="motMirror" data-i18n-title="motMirrorTitle"></button><label class="mot-dur"><span data-i18n="motDur"></span><input id="mot-dur" type="number" min="0.1" max="60" step="0.1">s</label><label class="mot-stretch" data-i18n-title="motStretchTitle"><input id="mot-stretch" type="checkbox"><span data-i18n="motStretch"></span></label></span>
        <button id="mot-lock" class="c-make" hidden data-i18n="motLock" data-i18n-title="motLockTitle"></button><span class="mot-grp g-del"><button id="mot-del" class="c-del" data-i18n="motDel" data-i18n-title="motDelTitle"></button><button id="mot-clear" class="c-del" data-i18n="motClearBtn" data-i18n-title="motClearTitle"></button></span>
        <span class="mot-grp g-save"><input id="mot-name" type="text" maxlength="40" data-i18n-title="motNameTitle"><button id="mot-save" class="c-save" data-i18n="motSave" data-i18n-title="motSaveTitle"></button></span>
      </div>
      <div id="lib-panel" hidden>
        <div class="pk-head"><button type="button" id="lib-back" hidden>←</button><b id="lib-title"></b><button type="button" id="lib-close">✕</button></div>
        <div id="lib-body"></div>
      </div>
      <div id="pack-panel" hidden>
        <div class="pk-head"><b data-i18n="packTitle"></b><button type="button" id="pack-close">✕</button></div>
        <div class="pk-desc" data-i18n="packDesc"></div>
        <label class="pk-lab"><span data-i18n="packNameLab"></span><input id="pack-name" type="text" maxlength="40"></label>
        <div class="pk-btns">
          <button type="button" id="pack-add" class="c-save" data-i18n="packAdd" data-i18n-title="packAddTitle"></button>
          <button type="button" id="pack-open" class="c-get" data-i18n="packOpen" data-i18n-title="packOpenTitle"></button>
          <button type="button" id="pack-save" class="c-save" data-i18n="packSave" data-i18n-title="packSaveTitle"></button>
        </div>
        <div id="pack-list"></div>
        <div class="pk-hint" data-i18n="packLibHint"></div>
        <input type="file" id="pack-input" accept=".json,application/json" multiple hidden>
      </div>
      <div id="strip-bar" hidden>
        <span class="sb-tools"><button id="strip-tool-select" class="c-edit on" data-i18n="stripToolSelect" data-i18n-title="stripToolSelectTitle"></button><button id="strip-remove" class="c-del" data-i18n="stripToolDel" data-i18n-title="stripToolDelTitle"></button></span>
        <b class="sb-title" data-i18n="stripTitle"></b>
        <span id="strip-sel"></span>
        <span class="sb-grp"><span data-i18n="stripReps"></span><button id="strip-rep-dn" class="c-edit">−</button><b id="strip-reps">1</b><button id="strip-rep-up" class="c-edit">＋</button></span>
        <label class="sb-grp"><span data-i18n="stripSpeed"></span><select id="strip-speed" class="c-edit"><option value="0.5">×0.5</option><option value="0.75">×0.75</option><option value="1">×1</option><option value="1.5">×1.5</option><option value="2">×2</option></select></label>
        <button id="strip-left" class="c-edit" data-i18n-title="stripLeftTitle">◀</button><button id="strip-right" class="c-edit" data-i18n-title="stripRightTitle">▶</button>
        <div style="flex:1"></div>
        <button id="strip-bake" class="c-make" data-i18n="stripBake" data-i18n-title="stripBakeTitle"></button>
        <button id="strip-clear" class="c-del" data-i18n="stripClear"></button>
      </div>
      <div id="mot-strip" hidden><div id="strip-blocks"></div><div id="strip-drop" hidden></div></div>
      <div id="mot-track">
        <div id="mot-ruler"></div>
        <div id="mot-keys"></div>
        <div id="mot-head"></div>
        <div id="mot-empty" data-i18n="motEmpty"></div>
      </div>
    </div>
  </div>

  <div id="set-screen">
    <aside id="set-side">
     <div id="set-side-scroll">
      <label class="set-name"><span data-i18n="setNameLab"></span><input id="set-name" type="text" maxlength="30" data-i18n-ph="setNamePh"></label>
      <div class="ss-sec ss-file" id="top-actions">
        <button id="save-btn" class="c-save ic-btn" data-tip="saveBtn" data-i18n-title="saveBtnTitle">💾</button>
        <button id="open-btn" class="c-get ic-btn" data-tip="openBtn" data-i18n-title="openBtnTitle">📂</button>
        <div id="export-wrap">
          <button type="button" id="export-btn" class="c-save ic-btn" data-tip="exportBtn" data-i18n-title="exportTitle">📤</button>
        </div>
      </div>
      <hr class="ss-div">
      <div class="ss-sec">
        <div class="ss-title ss-title-btn"><span data-i18n="ssTools"></span><button type="button" id="board-size-btn" class="c-edit ic-btn ic-sm" data-tip="boardSizeBtn" data-i18n-title="boardSizeTitle">📐</button></div>
        <div id="toolbar">
          <button class="tool-btn active" data-tool="select" data-i18n-title="tool_select"><span class="tb-ic">↖</span><span data-i18n="toolLabSelect"></span></button>
          <button type="button" class="tool-btn c-make" id="room-btn" data-i18n-title="tool_rectroom"><span class="tb-ic">🏠</span><span data-i18n="toolLabRoom"></span> ▾</button>
          <button class="tool-btn c-make" data-tool="wall" data-i18n-title="tool_wall"><span class="tb-ic">▮</span><span data-i18n="toolLabWall"></span></button>
        </div>
      </div>
      <div class="ss-sec ss-objs">
        <div class="ss-title"><span data-i18n="objTitle"></span><small data-i18n="ssObjHint"></small></div>
        <div class="obj-tabs" id="obj-tabs">
          <button type="button" data-cat="indoor" data-i18n="catIndoor"></button>
          <button type="button" data-cat="outdoor" data-i18n="catOutdoor"></button>
          <button type="button" data-cat="small" data-i18n="catSmall"></button>
          <button type="button" data-cat="people" data-i18n="catPeople"></button>
        </div>
        <div id="object-panel">
          <div class="obj-group" data-cat="indoor" data-i18n="objGroupWall"></div>
          <button class="obj-btn" data-cat="indoor" data-tool="door" data-i18n-title="obj_door_title"><span data-i18n="obj_door"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="indoor" data-tool="door2" data-i18n-title="obj_door2_title"><span data-i18n="obj_door2"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="indoor" data-tool="window" data-i18n-title="obj_window_title"><span data-i18n="obj_window"></span><small class="obj-size"></small></button>
          <div class="obj-group" data-cat="indoor" data-i18n="objGroupProps"></div>

          <button class="obj-btn" data-cat="indoor" data-tool="tv" data-i18n-title="obj_tv_title"><span data-i18n="obj_tv"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="indoor" data-tool="shelf" data-i18n-title="obj_shelf_title"><span data-i18n="obj_shelf"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="indoor" data-tool="lowcab" data-i18n-title="obj_lowcab_title"><span data-i18n="obj_lowcab"></span><small class="obj-size"></small></button>
          <div class="obj-group" data-cat="small" data-i18n="objGroupSmall"></div>
          <button class="obj-btn" data-cat="small" data-tool="lamp" data-i18n-title="obj_lamp_title"><span data-i18n="obj_lamp"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="small" data-tool="book" data-i18n-title="obj_book_title"><span data-i18n="obj_book"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="small" data-tool="plant" data-i18n-title="obj_plant_title"><span data-i18n="obj_plant"></span><small class="obj-size"></small></button>
          <div class="obj-group" data-cat="people" data-i18n="objGroupPeople"></div>
          <button class="obj-btn cam-btn" data-cat="people" data-tool="camera" data-i18n-title="obj_camera_title"><span data-i18n="obj_camera"></span><small data-i18n="obj_camera_sub"></small></button>
          <button class="obj-btn cast-btn" data-cat="people" data-tool="actor" data-i18n-title="obj_actor_title"><span data-i18n="obj_actor"></span><small data-i18n="obj_actor_sub"></small></button>
          <button class="obj-btn" data-cat="people" data-tool="person" data-i18n-title="obj_person_title"><span data-i18n="obj_person"></span><small class="obj-size"></small></button>
          <div class="obj-group" data-cat="outdoor" data-i18n="objGroupTrDraw"></div>
          <button class="obj-btn tr-btn" data-cat="outdoor" data-tool="tr-river" data-i18n-title="trRiverTitle"><span data-i18n="tr_btn_river"></span></button>
          <button class="obj-btn tr-btn" data-cat="outdoor" data-tool="tr-road" data-i18n-title="trRoadTitle"><span data-i18n="tr_btn_road"></span></button>

          <button class="obj-btn" data-cat="outdoor" data-tool="hill" data-i18n-title="obj_hill_title"><span data-i18n="obj_hill"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="outdoor" data-tool="bridge" data-i18n-title="obj_bridge_title"><span data-i18n="obj_bridge"></span><small class="obj-size"></small></button>

          <button class="obj-btn" data-cat="outdoor" data-tool="pine" data-i18n-title="obj_pine_title"><span data-i18n="obj_pine"></span><small class="obj-size"></small></button>

          <button class="obj-btn" data-cat="outdoor" data-tool="fence" data-i18n-title="obj_fence_title"><span data-i18n="obj_fence"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="outdoor" data-tool="car" data-i18n-title="obj_car_title"><span data-i18n="obj_car"></span><small class="obj-size"></small></button>
          <button class="obj-btn" data-cat="outdoor" data-tool="house" data-i18n-title="obj_house_title"><span data-i18n="obj_house"></span><small class="obj-size"></small></button>

      </div>
     </div>
     <div id="set-side-dock">
      <div class="ss-sec ss-memo">
        <div class="ss-title"><span><span data-i18n="memoTitle"></span> <span class="ss-info" data-i18n-title="memoHint">ⓘ</span></span><small id="memo-count"></small></div>
        <div class="memo-row">
          <button type="button" id="memo-show" class="c-view" data-i18n-title="memoShowTitle"></button>
          <button type="button" id="memo-clear" class="c-del" data-i18n="memoClearBtn" data-i18n-title="memoClearTitle"></button>
        </div>
      </div>
      <div class="ss-sec ss-sel" id="prop-panel">
        <div class="ss-title" id="sel-title"></div>
        <div class="prop-group" id="multi-group">
          <div class="prop-title" id="multi-count"></div>
        </div>
        <div class="prop-group" id="tr-group"><div class="tr-info"></div><label class="tr-num"><span></span><input type="number" step="0.5" min="0.5"></label></div>
        <div class="prop-group" id="light-group">
          <div class="action-row"><button class="action-btn c-make" id="light-btn"></button></div>
        </div>
        <div class="prop-group" id="rotate-group">
          <div class="action-row"><button class="action-btn c-edit" id="rotate-btn" data-i18n="rotateBtn"></button></div>
          <div class="action-row" id="door-kind" hidden><button type="button" class="action-btn c-edit" data-kind="1" data-i18n="doorKind1" data-i18n-title="doorKind1Title"></button><button type="button" class="action-btn c-edit" data-kind="2" data-i18n="doorKind2" data-i18n-title="doorKind2Title"></button></div>
        </div>
        <div class="prop-group" id="cast-group">
          <label class="cast-name-row"><i id="cast-dot"></i><input id="cast-name" type="text" maxlength="24" data-i18n-title="castNameTitle"></label>
          <div class="cast-info" id="cast-info"></div>

            <label class="cm-mount"><span data-i18n="camMount"></span><select id="cam-mount" data-i18n-title="camMountTitle"></select></label>
            <label class="cm-actor"><span data-i18n="camActor"></span><select id="cam-actor"></select></label>
            <label class="cm-shot"><span data-i18n="camShot"></span><select id="cam-shot" data-i18n-title="camShotTitle"></select></label>
            <label class="cm-dist"><span data-i18n="camDist"></span><input id="cam-dist" type="number" min="0.2" max="30" step="0.1" data-i18n-title="camDistTitle"></label>
            <label class="cm-h"><span data-i18n="camH"></span><input id="cam-h" type="number" min="0.2" max="40" step="0.1"></label>
            <label class="cm-tilt"><span data-i18n="camTilt"></span><input id="cam-tilt" type="number" min="-60" max="89" step="1" data-i18n-title="camTiltTitle"></label>
